package_linux_x64_release:
  extends: .release_package
  allow_failure: true
  image: "$BUILD_GCC_DEB_IMAGE"
  needs:
    - job: build:linux:matrix
      parallel:
        matrix:
          - COMPILER: "gcc"
            BUILD_TYPE: "Release"
      artifacts: true
  script:
    - set -euo pipefail
    # 2026-09-14: same class of fix as the Windows package jobs below --
    # build:linux:matrix carries allow_failure: true on its tag+Release rule,
    # so GitLab's needs: mechanism runs this job regardless of whether that
    # build succeeded, failed, or was cancelled. Check for real build output
    # before spending time on apt-get/cmake --install against a build/ that
    # was never finished. This is a cheap early guard, not proof -- proof is
    # *check_attestation_bash below.
    #
    # 2026-09-16: exits 1, not 0 -- allow_failure: true on this job already
    # absorbs it, but exit 1 shows an honest "failed (allowed)" warning
    # instead of a plain green pass for a job that packaged nothing
    # (confirmed necessary from a real run on the equivalent Windows guard).
    - |
      if [ ! -f build/CMakeCache.txt ]; then
        echo "No build/CMakeCache.txt found -- the upstream build job did not finish (cancelled, failed, or never ran). Nothing to package."
        exit 1
      fi
    - *check_attestation_bash
    - apt-get update
    - apt-get install -y rpm binutils
    - cmake --install build --prefix instdir --strip
    - test -n "$(find instdir -type f -print -quit)"
    - mkdir -p release-assets
    - *read_canonical_base_bash
    - tar -C instdir -czf "release-assets/${CANONICAL_BASE}.tar.gz" .
    - cd build
    # 2026-09-13 fix: these were previously chained with && under
    # set -euo pipefail -- a DEB failure would short-circuit RPM entirely
    # AND abort the whole job before the already-built tar.gz above ever got
    # uploaded (artifacts only upload on success by default). Each format is
    # now independent: a failure here is logged, not fatal.
    - cpack -C Release -G DEB || echo "DEB packaging failed."
    - cpack -C Release -G RPM || echo "RPM packaging failed."
    - cpack -C Release -G ZIP || echo "ZIP packaging failed."
    - cpack -C Release -G 7Z || echo "7Z packaging failed."
    - cd ..
    - cp build/package/*.deb build/package/*.rpm build/package/*.zip build/package/*.7z release-assets/ 2>/dev/null || true
    - ls -la release-assets
  artifacts:
    when: always
    paths:
      - release-assets/
    expire_in: 1 week

package_linux_arm64_release:
  extends: .release_package
  allow_failure: true
  image: debian:bookworm
  tags:
    - saas-linux-small-arm64
  needs:
    - job: build:linux:arm64
      artifacts: true
  script:
    # 2026-09-08: this job previously ran `cmake --install ... 2>/dev/null ||
    # (fallback)` in a bare debian:bookworm that has no cmake. The failure was
    # swallowed, the fallback searched `build -maxdepth 1` for a binary that
    # actually lives in build/bin/, and the job then published an EMPTY tarball
    # with a green checkmark. cmake and binutils are now installed, the
    # fallback is gone, and the tree is asserted non-empty before packing.
    - set -euo pipefail
    # 2026-09-16: exits 1, not 0 -- see the matching comment on
    # package_linux_x64_release's guard; allow_failure:true already absorbs
    # it, this just makes the status honest instead of a plain green pass.
    - |
      if [ ! -f build/CMakeCache.txt ]; then
        echo "No build/CMakeCache.txt found -- the upstream build job did not finish (cancelled, failed, or never ran). Nothing to package."
        exit 1
      fi
    - *check_attestation_bash
    - apt-get update
    - apt-get install -y cmake binutils rpm
    - cmake --install build --prefix instdir --strip
    - test -n "$(find instdir -type f -print -quit)"
    - mkdir -p release-assets
    - *read_canonical_base_bash
    - tar -C instdir -czf "release-assets/${CANONICAL_BASE}.tar.gz" .
    - cd build
    # 2026-09-13: DEB/RPM/ZIP/7Z are new for this leg (previously tar.gz only).
    # Same as x64: each format is independent, a failure here is logged, not
    # fatal. This is the first real run of DEB/RPM on this arm64 image --
    # treat it as unproven until confirmed, same as build:windows:mingw was.
    - cpack -C Release -G DEB || echo "DEB packaging failed."
    - cpack -C Release -G RPM || echo "RPM packaging failed."
    - cpack -C Release -G ZIP || echo "ZIP packaging failed."
    - cpack -C Release -G 7Z || echo "7Z packaging failed."
    - cd ..
    - cp build/package/*.deb build/package/*.rpm build/package/*.zip build/package/*.7z release-assets/ 2>/dev/null || true
    - ls -la release-assets
  artifacts:
    when: always
    paths:
      - release-assets/
    expire_in: 1 week

package_macos_release:
  extends: .release_package
  tags:
    - saas-macos-medium-m1
  allow_failure: true
  needs:
    - job: build:macos
      parallel:
        matrix:
          - BUILD_TYPE: "Release"
      artifacts: true
      optional: true
  script:
    - set -euo pipefail
    - mkdir -p release-assets
    - |
      # Covers two distinct cases with one check: build/ never existing at all
      # (expected while GitLab macOS runner entitlement is still pending --
      # Blocker 2) and build/ existing but incomplete because build:macos
      # itself was cancelled or failed after starting (build:macos carries
      # allow_failure: true on its tag+Release rule, so this job still runs
      # either way -- same fix applied to the other package_* jobs, 2026-09-14).
      #
      # 2026-09-16: exits 1, not 0 -- this job already carries
      # allow_failure: true, so the overall release still succeeds either
      # way; exit 1 just means THIS job shows an honest "failed (allowed)"
      # warning instead of a plain green pass for producing nothing.
      if [ ! -f build/CMakeCache.txt ]; then
        echo "No build/CMakeCache.txt found (expected while GitLab macOS runner entitlement is pending -- Blocker 2 -- or if build:macos was cancelled/failed). No macOS release asset this run; the overall release still succeeds."
        exit 1
      fi
    - *check_attestation_bash
    - cmake --install build --prefix instdir --strip
    - test -n "$(find instdir -type f -print -quit)"
    - *read_canonical_base_bash
    - tar -C instdir -czf "release-assets/${CANONICAL_BASE}.tar.gz" .
    - cd build
    # 2026-09-13 fix: this was `cd build && cpack ... && cd .. || echo ...`.
    # If cpack failed, the whole chain short-circuited *before* `cd ..` ran,
    # leaving the script stranded inside build/ for every command after --
    # the .dmg copy and (now) ZIP/7Z below would have silently resolved
    # against the wrong directory. Each format now runs independently and
    # `cd ..` always runs regardless of any single format's outcome.
    - cpack -C Release -G DragNDrop || echo "DragNDrop packaging failed -- shipping without the .dmg for this platform."
    - cpack -C Release -G ZIP || echo "ZIP packaging failed."
    - cpack -C Release -G 7Z || echo "7Z packaging failed."
    - cd ..
    - cp build/package/*.dmg build/package/*.zip build/package/*.7z release-assets/ 2>/dev/null || true
    - ls -la release-assets
  artifacts:
    when: always
    paths:
      - release-assets/
    expire_in: 1 week

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  # 2026-09-14: replaced needs: with dependencies:, and moved this job to its
  # own `release` stage strictly after the new `package` stage. This was the
  # actual bug: needs:optional only ignores a dependency that's absent from
  # the pipeline via rules -- it does NOT ignore one that exists but was
  # skipped/canceled/never played. Confirmed via GitLab's own current docs:
  # "If the earlier job does not generate artifacts, or is a manual job that
  # didn't run, the dependent job still runs and does not generate an error."
  # dependencies: is pure artifact selection with no execution-order opinion,
  # so ordinary stage sequencing is what actually lets this job start even
  # when some package_* jobs above were skipped or canceled. One caveat from
  # the same docs, not yet hit but worth knowing: if a listed job's artifacts
  # expire before this runs, THAT specifically does cause a hard failure --
  # unlike "never ran", which is silently tolerated.
  dependencies:
    - package_windows_x64_release
    - package_windows_x86_release
    - package_windows_mingw_x64_release
    - package_windows_mingw_x86_release
    # 2026-09-14: LLVM and ARM64 added here even though neither has ever
    # produced a real artifact yet. dependencies: does not error on a job
    # that never ran or produced nothing (same tolerant behavior that fixed
    # this job's original skip bug) -- so listing them now costs nothing and
    # means the moment either one is actually proven, its output is picked
    # up automatically with no further edit needed here.
    - package_windows_llvm_x64_release
    - package_windows_llvm_x86_release
    - package_windows_arm64_release
    - package_windows_mingw_arm64_release
    - package_linux_x64_release
    - package_linux_arm64_release
    - package_macos_release
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    # `set -eu`, not `set -euo pipefail`: Alpine-based image, ash, where
    # pipefail is non-POSIX with version-dependent support.
    - set -eu
    - apk add --no-cache findutils coreutils git >/dev/null 2>&1 || true
    - |
      if glab release view "$CI_COMMIT_TAG" >/dev/null 2>&1; then
        echo "ERROR: a Release already exists for tag $CI_COMMIT_TAG."
        echo "This almost always means release notes were typed into the GitLab"
        echo "web UI while creating the tag, which creates the Release at once."
        echo "Delete that Release (the tag can stay) and re-run this job."
        exit 1
      fi
    - mkdir -p all-assets
    - *resolve_version_bash
    # 2026-09-13: source archives, generated straight from git (no extra
    # tooling beyond git itself) rather than relying on any single platform
    # job. Non-fatal on purpose: a missing git binary or a shallow-clone edge
    # case shouldn't take down an otherwise-good release of the actual
    # binaries -- log it and move on, matching the same principle applied to
    # every optional package format elsewhere in this file.
    #
    # 2026-09-15: filename switched to the same canonical
    # <project>_<version>_source scheme as every binary asset -- previously
    # "$RELEASE_ARCHIVE_PREFIX-src.zip" with no version in it at all.
    - git archive --format=zip --output="all-assets/${RELEASE_ARCHIVE_PREFIX}_${RESOLVED_VERSION}_source.zip" HEAD || echo "Source .zip generation failed."
    - git archive --format=tar.gz --output="all-assets/${RELEASE_ARCHIVE_PREFIX}_${RESOLVED_VERSION}_source.tar.gz" HEAD || echo "Source .tar.gz generation failed."
    - |
      # Collect every packaging job's artifacts into one flat directory and
      # refuse to let two platforms overwrite each other.
      #
      # IMPORTANT: this deliberately does NOT use `find ... | while read`.
      # A piped while-loop runs in a SUBSHELL, so an `exit 1` inside it exits
      # only the subshell and the job carries on and publishes anyway. That
      # exact mistake was present in an earlier draft of this guard.
      dup=0
      for f in $(find . -mindepth 2 -path "*/release-assets/*" -type f | sort); do
        base=$(basename "$f")
        if [ -e "all-assets/$base" ]; then
          echo "ERROR: duplicate release asset filename: $base"
          dup=1
        else
          cp "$f" "all-assets/$base"
        fi
      done
      if [ "$dup" -ne 0 ]; then
        echo ""
        echo "Two packaging jobs produced the same filename. Check"
        echo "CPACK_PACKAGE_FILE_NAME in cmake/cpack_module.cmake -- it must"
        echo "include both the system name and the architecture."
        exit 1
      fi
      count=$(find all-assets -type f | wc -l | tr -d ' ')
      if [ "$count" -eq 0 ]; then
        echo "ERROR: no release assets collected. Refusing to create an empty Release."
        exit 1
      fi
      echo "Collected $count release asset(s)."
    - (cd all-assets && sha256sum * > SHA256SUMS)
    - ls -la all-assets
    - cat all-assets/SHA256SUMS
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "Release $CI_COMMIT_TAG" \
        --notes "ProjectCLI $CI_COMMIT_TAG, built from commit $CI_COMMIT_SHORT_SHA. Includes Windows MSVC (x64/x86, automatic); MinGW, LLVM/clang-cl, and ARM64 (all toolchains) are manually-triggered per release while unproven and only present if triggered. Also Linux (x86_64/arm64), and macOS (arm64, best-effort while GitLab macOS runner entitlement is pending) archives and installers where available, plus source archives and SHA256SUMS. Not every format is guaranteed for every target -- see SHA256SUMS for exactly what was published this release. Asset filenames carry their target system, architecture, and toolchain." \
        ./all-assets/*
  artifacts:
    paths:
      - all-assets/SHA256SUMS
    expire_in: 1 week

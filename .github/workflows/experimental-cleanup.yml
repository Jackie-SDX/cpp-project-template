name: Experimental Cleanup

on:
  push:
    branches:
      - experimental/all-platforms-architectures-v2
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-slim
    steps:
      - name: Cancel stale experimental runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          runs_json="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}&per_page=100")"

          python3 - "$CURRENT_SHA" "$runs_json" <<'PY'
          import json, os, subprocess, sys
          current_sha, raw = sys.argv[1], sys.argv[2]
          data = json.loads(raw)
          active = {"queued", "in_progress", "pending", "waiting", "requested"}
          current_id = int(os.environ["GITHUB_RUN_ID"])

          for run in data.get("workflow_runs", []):
              rid = int(run["id"])
              if rid == current_id:
                  continue
              if run.get("head_sha") == current_sha:
                  continue
              if run.get("status") not in active:
                  continue
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{rid}/cancel"
              print(f"Cancelling stale run {rid}: {run.get('name')} ({run.get('head_sha')})")
              subprocess.run([
                  "curl", "-fsSL", "-X", "POST",
                  "-H", "Accept: application/vnd.github+json",
                  "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                  "-H", "X-GitHub-Api-Version: 2026-03-10",
                  url
              ], check=True)
          PY

      - name: Delete this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/experimental-cleanup.yml"
          sha="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "$api" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"

          curl -fsSL -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "$api"             -d "$(python3 - "$sha" "$BRANCH" <<'PY'
          import json, sys
          sha, branch = sys.argv[1], sys.argv[2]
          print(json.dumps({
              "message": "experimental: remove temporary cleanup workflow",
              "sha": sha,
              "branch": branch
          }))
          PY
          )"

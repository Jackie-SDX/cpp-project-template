name: Experimental Android NDK
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  ANDROID_NDK_VERSION: 30.0.16248370
  ANDROID_PLATFORM: android-28
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Android arm64-v8a
          abi: arm64-v8a
          expected_machine: AArch64
          cache_id: android-arm64-v8a
        - name: Android armeabi-v7a
          abi: armeabi-v7a
          expected_machine: ARM
          cache_id: android-armeabi-v7a
        - name: Android x86_64
          abi: x86_64
          expected_machine: Advanced Micro Devices X86-64
          cache_id: android-x86_64
        - name: Android x86
          abi: x86
          expected_machine: Intel 80386
          cache_id: android-x86
    steps:
    - name: Checkout
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      with:
        submodules: true
        path: project
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        java-version: '17'
        distribution: temurin
    - name: Set up Android SDK and NDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      with:
        packages: platform-tools platforms;android-28 ndk;30.0.16248370
    - name: Configure Android environment
      shell: bash
      run: 'set -euo pipefail

        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

        test -n "$sdk_root"

        ndk_home="$sdk_root/ndk/${ANDROID_NDK_VERSION}"

        test -f "$ndk_home/build/cmake/android.toolchain.cmake"

        echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

        echo "ANDROID_NDK_HOME=$ndk_home"

        '
    - name: Install build tools
      run: 'sudo apt-get update

        sudo apt-get install -y ninja-build ccache

        '
    - name: Restore compiler cache
      id: ccache-restore
      uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb
      with:
        path: .ccache
        key: ccache-experimental-v2-${{ matrix.cache_id }}-Release
        restore-keys: 'ccache-experimental-v2-${{ matrix.cache_id }}-Release-

          ccache-experimental-${{ matrix.cache_id }}-Release-

          '
    - name: Configure
      working-directory: project
      env:
        RUNNER_OS: Linux
        BUILD_TYPE: Release
        ANDROID_ABI: ${{ matrix.abi }}
        ANDROID_PLATFORM: ${{ env.ANDROID_PLATFORM }}
        BUILD_PROJECTWX: false
        BUILD_TESTING: false
      run: cmake -P ./.github/scripts/configure.cmake
    - name: Build
      working-directory: project
      env:
        RUNNER_OS: Linux
        BUILD_TYPE: Release
      run: cmake -P ./.github/scripts/build.cmake
    - name: Save compiler cache
      if: always() && steps.ccache-restore.outputs.cache-hit != 'true' && hashFiles('.ccache/**') != ''
      uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb
      with:
        path: .ccache
    - name: Verify Android ELF architecture
      working-directory: project
      shell: bash
      run: 'set -euo pipefail

        target="$(find build/bin -maxdepth 1 -type f -name ''projectcli*'' -print -quit)"

        test -n "$target"

        readelf -h "$target"

        readelf -h "$target" | grep -F "Machine:" | grep -F -- "${{ matrix.expected_machine }}"

        '
'on':
  push:
    branches:
    - experimental/all-platforms-architectures-v2
  workflow_dispatch: null

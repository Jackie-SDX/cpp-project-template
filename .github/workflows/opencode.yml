# =============================================================================
# opencode - repository-local /oc bot responder
# =============================================================================
# Purpose
# --------
# Responds to issue/PR review comments that begin with ``/oc`` or ``/opencode``
# and runs the opencode agent against this repository on GitHub's hosted
# runners. It is intentionally minimal (checkout + single agent action); heavy
# pipeline policy lives in the controller repository, not here.
#
# Security note
# -------------
#   * The condition matches any comment containing ``/oc``; keep the secret
#     scope here to only what this agent action needs.
#
# References
# ----------
#   * opencode GitHub Action: https://opencode.ai/docs
#   * Events that trigger:   https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows
# =============================================================================

name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        BUILD_TYPE: Release
        ANDROID_ABI: ${{ matrix.abi }}
        ANDROID_PLATFORM: ${{ env.ANDROID_PLATFORM }}
        BUILD_PROJECTWX: false
        BUILD_TESTING: false
      run: cmake -P ./.github/scripts/configure.cmake
    - name: Build
      working-directory: project
      env:
        RUNNER_OS: Linux
        BUILD_TYPE: Release
      run: cmake -P ./.github/scripts/build.cmake
    - name: Save compiler cache
      if: always() && steps.ccache-restore.outputs.cache-hit != 'true' && hashFiles('.ccache/**') != ''
      uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb
      with:
        path: .ccache
    - name: Verify Android ELF architecture
      working-directory: project
      shell: bash
      run: 'set -euo pipefail

        target="$(find build/bin -maxdepth 1 -type f -name ''projectcli*'' -print -quit)"

        test -n "$target"

        readelf -h "$target"

        readelf -h "$target" | grep -F "Machine:" | grep -F -- "${{ matrix.expected_machine }}"

        '
    - name: Package Android
      working-directory: project
      shell: bash
      run: 'set -euo pipefail

        if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then version=$(printf ''%s'' "$GITHUB_REF_NAME" | sed ''s/^v//''); else version=$(git
        describe --tags --always --dirty | sed ''s/^v//''); fi

        target=$(find build/bin -maxdepth 1 -type f -name ''projectcli*'' -print -quit)

        test -n "$target"

        mkdir -p android-release/bin release-assets

        cp "$target" android-release/bin/

        printf ''Project: cpp-project-template\nVersion: %s\nAndroid ABI: %s\nNDK: %s\nAPI: %s\n'' "$version" ${{ matrix.abi }} "$ANDROID_NDK_VERSION" "$ANDROID_PLATFORM"
        > android-release/BUILD-INFO.txt

        (cd android-release && zip -q -r "../release-assets/cpp-project-template_$version_android-ndk-${{ matrix.abi }}.zip" .)'
    - name: Upload Android package artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-${{ matrix.name }}
        path: project/release-assets/*
        if-no-files-found: error
'on':
  pull_request:
    branches:
    - main
  push:
    tags:
    - v*
  workflow_dispatch: null

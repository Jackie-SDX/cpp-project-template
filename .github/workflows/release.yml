# =============================================================================
# Release - production cross-platform package matrix + GitHub release publish
# =============================================================================
# Purpose
# --------
# Builds the full desktop artifact matrix (Windows MSVC/MinGW/LLVM, Linux
# GCC/Clang, macOS Clang/GCC/LLVM; 54 packages after Android support was
# retired, the 20 ``.7z`` standalone archives were removed, and the Linux
# ``.zip`` / macOS ``.tar.gz`` convenience archives were dropped under the
# strict one-archive-per-platform policy), validates the inventory against
# packaging/release-contract.tsv (56 files for the package+source scope, 61
# for the published GitHub release: + SHA256SUMS, release-contract.tsv,
# release-evidence.json, release-sbom.spdx.json, verify-release.sh) and
# publishes a GitHub release with generated checksums and provenance
# attestations when a ``v*`` tag is pushed. Package counts are never
# hardcoded here -- scripts/release_contract.sh is the source of truth.
#
# Android / NDK support was removed from this pipeline in this revision; see
#   - .github/scripts/configure.cmake    (NDK toolchain branch deleted)
#   - .github/workflows/experimental-android-ndk.yml  (workflow removed)
#   - .github/scripts/package_android_apk.sh          (APK packager removed)
#   - packaging/android/               (APK manifest + activity removed)
# and the release inventory counts below are now 54 packages + 2 source
# archives instead of 93 + 2 (Android removal dropped 93+2 to 85+2; the 20
# ``.7z`` standalone archives removed under the archive-format policy dropped
# that to 65+2; the Linux ``.zip`` and macOS ``.tar.gz`` convenience archives
# removed under the strict policy dropped that to 54+2).
#
# Standalone archive format policy (2026-09-23, strict)
# -----------------------------------------------------
#   Windows  -> .zip       standalone archive only (.7z removed)
#   Linux    -> .tar.gz    standalone archive only (no .zip)
#   macOS    -> .zip       standalone archive only (no .tar.gz)
# Each platform ships exactly one standalone archive per toolchain (plus its
# installers and the source archives). ``.7z`` is never generated, uploaded,
# or published. The historical optional Windows CPack 7Z generator is preserved
# as a commented-out disabled block in the Windows packaging steps below so it
# stays documented without shipping. Installers (.msi/.exe, .deb/.rpm, .dmg)
# and source archives are unchanged.
# See docs/PROJECT_DOCUMENTATION.md § 6.5 (policy) and § 13 (full session
# record), and docs/install.md#archive.
#
# Trigger rules
# -------------
#   * ``v*`` tag pushes (production release), pull requests against ``main``
#     (smoke gates only), and manual dispatch.
#
# Job dependency graph
# --------------------
#   cache-gate -> package/source/expanded-package -> validate-release -> publish
#   package-smoke runs on PRs without the ``full-release-test`` label.
#   A PR must carry the ``full-release-test`` label to run the full matrix.
#
# References
# ----------
#   * Workflow syntax:      https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#   * Strategies/matrices:  https://docs.github.com/en/actions/using-jobs/using-a-build-matrix-for-your-jobs
#   * Releasing:            https://docs.github.com/en/actions/how-to/automating-releases
#   * Artifacts:            https://docs.github.com/en/actions/using-workflows/storing-workflow-data-as-artifacts
#   * softprops/action-gh-release: https://github.com/softprops/action-gh-release
#   * Caching:              https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
# =============================================================================

name: Release

# Workflow-definition refresh: tag pushes (v*) are the production release trigger.
# Keep this comment with the trigger block so GitHub re-registers the current definition.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  VCPKG_GIT_REF: e0a6b8572cf0ac716fdc11466522cf744e97e0bd
  VCPKG_CACHE_NAMESPACE: master
  MY_VCPKG_TRIPLETS_COMMIT: e5f3f2d06430fa475feccbb34a5d61023807b854
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
jobs:
  # cache-gate: warms/proves the vcpkg + compiler caches used by every
  # downstream package job and fails fast on tag runs when the upstream
  # release cache contract is not satisfiable.

  cache-gate:
    name: Windows release cache gate (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-release-test'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            compiler: msvc
            os: windows-latest
            arch: x64
            tool_arch: X64
          - name: Windows MSVC x86
            compiler: msvc
            os: windows-latest
            arch: x86
            tool_arch: X64
          - name: Windows MSVC ARM64
            compiler: msvc
            os: windows-11-arm
            arch: arm64
            tool_arch: ARM64
          - name: Windows LLVM x64
            os: windows-latest
            compiler: llvm
            arch: x64
            tool_arch: X64
          - name: Windows LLVM x86
            os: windows-latest
            compiler: llvm
            arch: x86
            tool_arch: X64
          - name: Windows LLVM ARM64
            os: windows-11-arm
            compiler: llvm
            arch: arm64
            tool_arch: ARM64
          - name: Windows MinGW x64
            compiler: mingw
            os: windows-latest
            arch: x64
            tool_arch: X64
          - name: Windows MinGW x86
            compiler: mingw
            os: windows-latest
            arch: x86
            tool_arch: X64
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: project }
      - name: Resolve cache prefix
        shell: bash
        run: |
          case "${{ matrix.compiler }}" in
            msvc) echo "VCPKG_CACHE_PREFIX=windows-${VCPKG_CACHE_NAMESPACE}-${{ matrix.arch }}-Release" >> "$GITHUB_ENV" ;;
            mingw) echo "VCPKG_CACHE_PREFIX=windows-mingw-${VCPKG_CACHE_NAMESPACE}-${{ matrix.arch }}-Release" >> "$GITHUB_ENV" ;;
            llvm) if [ "${{ matrix.arch }}" = "arm64" ]; then echo "VCPKG_CACHE_PREFIX=windows-${VCPKG_CACHE_NAMESPACE}-arm64-Release" >> "$GITHUB_ENV"; else echo "VCPKG_CACHE_PREFIX=windows-llvm-${VCPKG_CACHE_NAMESPACE}-${MY_VCPKG_TRIPLETS_COMMIT}-${{ matrix.arch }}-Release" >> "$GITHUB_ENV"; fi ;;
            *) echo "Unsupported cache compiler: ${{ matrix.compiler }}" >&2; exit 1 ;;
          esac
      - name: Restore release package cache
        id: package-cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: project/vcpkg_cache
          key: ${{ env.VCPKG_CACHE_PREFIX }}-${{ hashFiles('project/vcpkg.json') }}
          restore-keys: |
            ${{ env.VCPKG_CACHE_PREFIX }}-
          lookup-only: true
      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_GIT_REF }}
          path: vcpkg
          fetch-depth: 1
      - name: Restore vcpkg tool cache
        id: vcpkg-tool-cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: vcpkg/vcpkg.exe
          key: vcpkg-tool-windows-${{ matrix.tool_arch }}-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
          restore-keys: |
            vcpkg-tool-windows-${{ matrix.tool_arch }}-${{ env.VCPKG_GIT_REF }}-
          lookup-only: true
      - name: Enforce upstream release cache contract
        if: github.repository == 'Jackie-SDX/cpp-project-template' && (steps.package-cache.outputs.cache-hit != 'true' || steps.vcpkg-tool-cache.outputs.cache-hit != 'true')
        shell: pwsh
        run: throw "Release cache gate failed for ${{ matrix.name }}. Package cache hit=${{ steps.package-cache.outputs.cache-hit }}, vcpkg tool cache hit=${{ steps.vcpkg-tool-cache.outputs.cache-hit }}. Seed the release vcpkg caches with vcpkg-cache-warmup before tagging."
  # package: core 10-config desktop matrix (Windows MSVC/MinGW/LLVM, Linux GCC,
  # macOS Clang). Skipped on plain PRs unless the full-release-test label is set.

  package:
    needs: cache-gate
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-release-test')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows MSVC x64
          os: windows-latest
          cc: cl
          cxx: cl
          environment_script: vcvars64.bat
          vcpkg_triplet: x64-windows-static
          toolchain: msvc
          arch: x64
          nsis_generator: NSIS64
        - name: Windows MSVC x86
          os: windows-latest
          cc: cl
          cxx: cl
          environment_script: vcvars32.bat
          vcpkg_triplet: x86-windows-static
          toolchain: msvc
          arch: x86
          nsis_generator: NSIS
        - name: Windows MinGW x64
          os: windows-latest
          cc: gcc
          cxx: g++
          vcpkg_triplet: x64-mingw-dynamic
          toolchain: mingw
          arch: x64
          nsis_generator: NSIS64
          msys2_msystem: MINGW64
          msys2_toolchain: mingw-w64-x86_64-toolchain
          msys2_bin: mingw64/bin
        - name: Windows MinGW x86
          os: windows-latest
          cc: gcc
          cxx: g++
          vcpkg_triplet: x86-mingw-dynamic
          toolchain: mingw
          arch: x86
          nsis_generator: NSIS
          msys2_msystem: MINGW32
          msys2_toolchain: mingw-w64-i686-toolchain
          msys2_bin: mingw32/bin
        - name: Windows LLVM x64
          os: windows-latest
          cc: clang-cl
          cxx: clang-cl
          environment_script: vcvars64.bat
          vcpkg_triplet: x64-win-llvm-release
          toolchain: llvm
          arch: x64
          nsis_generator: NSIS64
        - name: Windows LLVM x86
          os: windows-latest
          cc: clang-cl
          cxx: clang-cl
          environment_script: vcvars32.bat
          vcpkg_triplet: x86-win-llvm
          toolchain: llvm
          arch: x86
          nsis_generator: NSIS
        - name: Linux GCC x64
          os: ubuntu-24.04
          cc: gcc
          cxx: g++
          toolchain: gcc
          arch: x64
        - name: Linux GCC arm64
          os: ubuntu-24.04-arm
          cc: gcc
          cxx: g++
          toolchain: gcc
          arch: arm64
        - name: macOS Clang arm64
          os: macos-latest
          cc: clang
          cxx: clang++
          toolchain: apple-clang
          arch: arm64
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: true
        fetch-depth: 0
        path: project
    # CORE-10/P0-6: resolve version + release epoch BEFORE configure so the
    # same VERSION feeds CPack (CPACK_PACKAGE_VERSION, installers, DEB/RPM)
    # and SOURCE_DATE_EPOCH normalizes every archive produced below.
    - name: Resolve release version, epoch and naming
      working-directory: project
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          # Non-tag runs (workflow_dispatch/PR validation): nearest release tag
          # only -- CMake project(VERSION) rejects describe output with commit
          # counts (0.0.9-13-g...), so it must never reach configure.
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          version="${version:-0.0.0}"
        fi
        epoch="$(git log -1 --format=%ct)"
        case "${{ runner.os }}" in
          Linux) platform="linux" ;;
          Windows) platform="windows" ;;
          macOS) platform="macos" ;;
          *) echo "unsupported runner OS ${{ runner.os }}" >&2; exit 1 ;;
        esac
        case "${{ matrix.arch }}" in
          x64) package_arch="x86_64" ;;
          x86) package_arch="i686" ;;
          arm64) package_arch="arm64" ;;
          *) echo "unsupported arch ${{ matrix.arch }}" >&2; exit 1 ;;
        esac
        {
          echo "VERSION=$version"
          echo "SOURCE_DATE_EPOCH=$epoch"
          echo "CPP_PROJECT_TEMPLATE_VERSION=$version"
          echo "RELEASE_PREFIX=cpp-project-template_${version}_${platform}-${{ matrix.toolchain }}-${package_arch}"
        } >> "$GITHUB_ENV"
        echo "version=$version epoch=$epoch"
    - name: Restore compiler cache
      id: ccache-restore
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ matrix.name }}-Release-${{ hashFiles('project/CMakeLists.txt', 'project/cmake/**', 'project/vcpkg.json') }}
        restore-keys: 'ccache-${{ runner.os }}-${{ matrix.name }}-Release-

          '
    - name: Locate MSVC environment script
      if: runner.os == 'Windows' && (matrix.toolchain == 'msvc' || matrix.toolchain == 'llvm')
      shell: pwsh
      run: '$vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

        $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

        if (-not $vsRoot) { throw "No Visual Studio installation with the C++ toolset was found." }

        $script = Join-Path $vsRoot "VC\Auxiliary\Build\${{ matrix.environment_script }}"

        if (-not (Test-Path $script)) { throw "Expected vcvars script not found at $script" }

        "ENVIRONMENT_SCRIPT=$script" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        '
    - name: Install packaging dependencies
      run: "if [ \"$RUNNER_OS\" = \"Linux\" ]; then\n  sudo apt-get update\n  sudo apt-get install -y ninja-build ccache rpm dpkg-dev libwxgtk3.2-dev libgtest-dev\n\
        elif [ \"$RUNNER_OS\" = \"Windows\" ]; then\n  choco install ninja ccache nsis 7zip -y --no-progress\n  choco install wixtoolset -y --no-progress\n\
        elif [ \"$RUNNER_OS\" = \"macOS\" ]; then\n  brew install ninja ccache wxwidgets googletest\nfi\n"
    - name: Refresh Windows environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: "if (Test-Path \"$env:ChocolateyInstall\\helpers\\chocolateyProfile.psm1\") {\n  Import-Module \"$env:ChocolateyInstall\\helpers\\chocolateyProfile.psm1\"\
        \n  refreshenv\n}\n7z | Select-Object -First 1\n"
    # CORE-1/P0-4: the MinGW legs must compile with the matching MSYS2
    # toolchain (x64->MINGW64, x86->MINGW32). Without this the runner's
    # stray gcc silently produces x86_64 binaries for the i686 leg.
    - name: Setup MSYS2 MinGW
      id: msys2
      if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
      with:
        msystem: ${{ matrix.msys2_msystem }}
        update: false
        path-type: minimal
        install: ${{ matrix.msys2_toolchain }}
    - name: Add MSYS2 compiler to PATH
      if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
      shell: pwsh
      run: |
        $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
        if (-not $msysRoot) { throw "MSYS2 location output was empty" }
        $bin = Join-Path $msysRoot "${{ matrix.msys2_bin }}"
        if (-not (Test-Path $bin)) { throw "MSYS2 compiler directory not found: $bin" }
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    - name: Assert MinGW target architecture
      if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
      shell: bash
      run: |
        set -euo pipefail
        case "${{ matrix.arch }}" in
          x64) want=x86_64-w64-mingw32 ;;
          x86) want=i686-w64-mingw32 ;;
          *) echo "unknown mingw arch ${{ matrix.arch }}" >&2; exit 1 ;;
        esac
        got=$(gcc -dumpmachine | tr '[:upper:]' '[:lower:]')
        echo "gcc -dumpmachine = $got (expected $want)"
        test "$got" = "$want"
    - name: Get Windows vcpkg triplets
      if: runner.os == 'Windows'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: Neumann-A/my-vcpkg-triplets
        ref: ${{ env.MY_VCPKG_TRIPLETS_COMMIT }}
        path: my-vcpkg-triplets
        fetch-depth: 1
    - name: Resolve GitLab-style vcpkg cache key
      if: runner.os == 'Windows'
      shell: bash
      run: "case \"${{ matrix.toolchain }}\" in\n  msvc) cache_prefix=\"windows-${VCPKG_CACHE_NAMESPACE}-${{ matrix.arch }}-Release\" ;;\n  mingw) cache_prefix=\"\
        windows-mingw-${VCPKG_CACHE_NAMESPACE}-${{ matrix.arch }}-Release\" ;;\n  llvm) cache_prefix=\"windows-llvm-${VCPKG_CACHE_NAMESPACE}-${MY_VCPKG_TRIPLETS_COMMIT}-${{\
        \ matrix.arch }}-Release\" ;;\n  *) echo \"Unsupported Windows cache toolchain: ${{ matrix.toolchain }}\" >&2; exit 1 ;;\nesac\necho \"VCPKG_CACHE_PREFIX=${cache_prefix}\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Restore GitLab-style vcpkg binary cache
      if: runner.os == 'Windows'
      id: vcpkg-binary-cache-restore
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: project/vcpkg_cache
        key: ${{ env.VCPKG_CACHE_PREFIX }}-${{ hashFiles('project/vcpkg.json') }}
        restore-keys: '${{ env.VCPKG_CACHE_PREFIX }}-

          '
    - name: Checkout Windows vcpkg
      if: runner.os == 'Windows'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: microsoft/vcpkg
        ref: ${{ env.VCPKG_GIT_REF }}
        path: vcpkg
        fetch-depth: 1
    - name: Restore Windows vcpkg tool cache
      if: runner.os == 'Windows'
      id: vcpkg-tool-cache
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: vcpkg/vcpkg.exe
        key: vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
        restore-keys: |
          vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-
    - name: Bootstrap Windows vcpkg
      if: runner.os == 'Windows' && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: vcpkg
      run: .\bootstrap-vcpkg.bat -disableMetrics
    - name: Verify Windows vcpkg tool
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Test-Path .\vcpkg\vcpkg.exe)) { throw 'vcpkg.exe was not restored or bootstrapped' }
        & .\vcpkg\vcpkg.exe version
    - name: Restore vcpkg download cache
      if: runner.os == 'Windows'
      id: vcpkg-download-cache
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: vcpkg_downloads
        key: vcpkg-downloads-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ matrix.toolchain }}-${{ matrix.arch }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
        restore-keys: |
          vcpkg-downloads-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-
    - name: vcpkg
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VCPKG_MANIFEST_MODE: OFF
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\project\vcpkg_cache,readwrite
        VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg_downloads
        VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
      run: |
        $installArgs = @('--triplet', '${{ matrix.vcpkg_triplet }}', '--overlay-triplets=${{ github.workspace }}\my-vcpkg-triplets', 'wxwidgets', 'gtest')
        $lastExitCode = 1
        for ($attempt = 1; $attempt -le 5; $attempt++) {
          & .\vcpkg\vcpkg.exe install @installArgs
          $lastExitCode = $LASTEXITCODE
          if ($lastExitCode -eq 0) { break }
          if ($attempt -lt 5) {
            Write-Host "vcpkg install failed with exit code $lastExitCode; retrying attempt $($attempt + 1)/5..."
            Start-Sleep -Seconds ([int][Math]::Pow(2, $attempt))
          }
        }
        if ($lastExitCode -ne 0) { throw "vcpkg install failed after 5 attempts with exit code $lastExitCode" }
    - name: Save vcpkg download cache
      if: always() && runner.os == 'Windows' && steps.vcpkg-download-cache.outputs.cache-hit != 'true' && hashFiles('vcpkg_downloads/**') != ''
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: vcpkg_downloads
        key: vcpkg-downloads-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ matrix.toolchain }}-${{ matrix.arch }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
    - name: Save Windows vcpkg tool cache
      if: runner.os == 'Windows' && success() && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: vcpkg/vcpkg.exe
        key: vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
    - name: Save GitLab-style vcpkg binary cache
      if: runner.os == 'Windows' && success() && steps.vcpkg-binary-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: project/vcpkg_cache
        key: ${{ env.VCPKG_CACHE_PREFIX }}-${{ hashFiles('project/vcpkg.json') }}
    - name: Configure
      working-directory: project
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        ENVIRONMENT_SCRIPT: ${{ env.ENVIRONMENT_SCRIPT }}
        RUNNER_OS: ${{ runner.os }}
        VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        BUILD_TYPE: Release
        PACKAGE_TOOLCHAIN: ${{ matrix.toolchain }}
      run: cmake -P ./.github/scripts/configure.cmake
    - name: Verify toolchain identity
      if: runner.os == 'Windows'
      working-directory: project
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
      run: 'if [ "$TOOLCHAIN" = "llvm" ]; then clang-cl --version

        elif [ "$TOOLCHAIN" = "mingw" ]; then g++ --version

        else cmd.exe /c "cl" 2>&1 | head -3

        fi

        '
    - name: Build
      working-directory: project
      env:
        CXX: ${{ matrix.cxx }}
        ENVIRONMENT_SCRIPT: ${{ env.ENVIRONMENT_SCRIPT }}
        RUNNER_OS: ${{ runner.os }}
        BUILD_TYPE: Release
      run: cmake -P ./.github/scripts/build.cmake
    - name: Save compiler cache
      if: always() && steps.ccache-restore.outputs.cache-hit != 'true' && hashFiles('.ccache/**') != ''
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ matrix.name }}-Release-${{ hashFiles('project/CMakeLists.txt', 'project/cmake/**', 'project/vcpkg.json') }}
    - name: Test
      working-directory: project
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        RUNNER_OS: ${{ runner.os }}
        BUILD_TYPE: Release
      run: cmake -P ./.github/scripts/test.cmake
    - name: Install
      working-directory: project
      run: cmake --install build --prefix instdir --strip --config Release
    - name: Verify install tree
      working-directory: project
      run: test -n "$(find instdir -type f -print -quit)"
    - name: Determine canonical package name
      id: package_name
      working-directory: project
      shell: bash
      run: 'base=$(sed -n ''s/.*CPACK_PACKAGE_FILE_NAME "\([^"]*\)".*/\1/p'' build/CPackConfig.cmake | head -1)

        test -n "$base"

        echo "base=$base" >> "$GITHUB_OUTPUT"

        '
    - name: Package Windows
      if: runner.os == 'Windows'
      working-directory: project
      shell: pwsh
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
        BASE: ${{ steps.package_name.outputs.base }}
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force release-assets | Out-Null
        & .\scripts\make_deterministic_zip.ps1 -InputDir instdir -OutputPath "release-assets\$env:PREFIX.zip" -Epoch ([int]$env:SOURCE_DATE_EPOCH)
        Push-Location build
        cpack --config CPackConfig.cmake -C Release -G "${{ matrix.nsis_generator }}"
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path "package\$env:BASE.exe")) { throw "NSIS package generation failed" }
        Copy-Item "package\$env:BASE.exe" "..\release-assets\${env:PREFIX}_nsis.exe" -Force
        # Standalone archive policy (2026-09-23): Windows ships .zip only. The
        # historical .7z alternative is retained here as a documented, disabled
        # block; uncomment the three lines below to restore it (requires the
        # 7zip tool installed above):
        # cpack --config CPackConfig.cmake -C Release -G 7Z
        # if ($LASTEXITCODE -ne 0 -or -not (Test-Path "package\$env:BASE.7z")) { throw "7Z package generation failed" }
        # Copy-Item "package\$env:BASE.7z" "..\release-assets\$env:PREFIX.7z" -Force
        cpack --config CPackConfig.cmake -C Release -G WIX
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path "package\$env:BASE.msi")) { throw "MSI package generation failed" }
        Copy-Item "package\$env:BASE.msi" "..\release-assets\${env:PREFIX}_wix.msi" -Force
        Pop-Location
    - name: Package Linux
      if: runner.os == 'Linux'
      working-directory: project
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
      run: 'mkdir -p release-assets

        scripts/make_deterministic_tarball.sh --epoch "$SOURCE_DATE_EPOCH" --input instdir --output "release-assets/${PREFIX}.tar.gz"

        cpack --config build/CPackConfig.cmake -C Release -G DEB

        cpack --config build/CPackConfig.cmake -C Release -G RPM

        deb=$(find build/package -maxdepth 1 -type f -name ''*.deb'' | head -1)

        rpm=$(find build/package -maxdepth 1 -type f -name ''*.rpm'' | head -1)

        test -n "$deb" && test -n "$rpm"

        cp "$deb" "release-assets/${PREFIX}.deb"

        cp "$rpm" "release-assets/${PREFIX}.rpm"

        '
    - name: Package macOS
      if: runner.os == 'macOS'
      working-directory: project
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
      run: |
        mkdir -p release-assets

        pwsh -NoProfile -File scripts/make_deterministic_zip.ps1 -InputDir instdir -OutputPath "release-assets/${PREFIX}.zip" -Epoch "$SOURCE_DATE_EPOCH"

        cpack_ok=0
        for attempt in 1 2 3; do
          if cpack --config build/CPackConfig.cmake -C Release -G DragNDrop; then
            cpack_ok=1
            break
          fi
          # CPack can transiently leave the temporary DMG mounted when hdiutil
          # reports a busy-detach failure. Force-detach before retrying.
          hdiutil detach /Volumes/cpp-project-template -force >/dev/null 2>&1 || true
          sleep $((attempt * 2))
        done
        if [[ "$cpack_ok" != "1" ]]; then
          echo "CPack DragNDrop failed after 3 attempts" >&2
          exit 1
        fi

        dmg=$(find build/package -maxdepth 1 -type f -name ''*.dmg'' | head -1)

        test -n "$dmg"

        cp "$dmg" "release-assets/${PREFIX}.dmg"

    # CORE-1/CORE-2: extract the ZIP candidate and prove the runtime DLL
    # closure plus a bounded CLI smoke straight from the FINAL payload.
    - name: Verify Windows package payload closure
      if: runner.os == 'Windows'
      working-directory: project
      shell: pwsh
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
        EXPECTED_ARCH: ${{ matrix.arch }}
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force verify-artifacts | Out-Null
        $want = switch ($env:EXPECTED_ARCH) {
          'x64' { 'x86_64' }
          'x86' { 'i686' }
          'arm64' { 'arm64' }
          default { throw "unknown arch $($env:EXPECTED_ARCH)" }
        }
        $zip = "release-assets\$env:PREFIX.zip"
        if (-not (Test-Path $zip)) { throw "zip not found: $zip" }
        if (Test-Path verify-zip) { Remove-Item -Recurse -Force verify-zip }
        Expand-Archive -Path $zip -DestinationPath verify-zip
        & .\cmake\windows\Resolve-WindowsRuntimeDeps.ps1 -Root verify-zip -ExpectedArch $want -Report "verify-artifacts\runtime-deps-$env:PREFIX.json"
        & .\verify-zip\bin\projectcli.exe -v
        if ($LASTEXITCODE -ne 0) { throw "projectcli smoke failed with exit code $LASTEXITCODE" }
        if (Test-Path "build\windows-runtime-dependencies.json") {
          Copy-Item "build\windows-runtime-dependencies.json" "verify-artifacts\install-tree-$env:PREFIX.json" -Force
        }
    # CORE-4 + USEFUL-5 (macOS): extract the ZIP candidate, assert the
    # .app contract (structure, Info.plist identity + version, Mach-O
    # architecture, no developer paths in load commands), mount + inspect
    # the DMG, generate the USEFUL-4 runtime report from the FINAL shipped
    # payload (not the build tree), and perform a bounded GUI launch.
    - name: Verify macOS package payload
      if: runner.os == 'macOS'
      working-directory: project
      shell: bash
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
        EXPECTED_ARCH: ${{ matrix.arch }}
        EXPECTED_VERSION: ${{ env.VERSION }}
      run: |
        set -euo pipefail
        mkdir -p verify-artifacts
        zip="release-assets/${PREFIX}.zip"
        test -f "$zip"
        rm -rf verify-macos && mkdir verify-macos
        unzip -q "$zip" -d verify-macos
        # --- CORE-4: .app bundle at payload root -----------------------------
        app=$(find verify-macos -maxdepth 2 -name '*.app' -type d | head -1)
        if [ -z "$app" ]; then
          echo "no .app bundle in zip payload:" >&2
          find verify-macos -maxdepth 3 >&2
          exit 1
        fi
        test -d "$app/Contents/MacOS"
        bin=$(find "$app/Contents/MacOS" -type f | head -1)
        test -n "$bin"
        echo "bundle: $app"
        # --- CORE-4/CORE-10: Info.plist parses, identity + version correct --
        test -f "$app/Contents/Info.plist"
        python3 - "$app/Contents/Info.plist" "$EXPECTED_VERSION" <<'PY'
        import plistlib, re, sys
        path, version = sys.argv[1], sys.argv[2]
        with open(path, "rb") as fh:
            info = plistlib.load(fh)
        bid = info.get("CFBundleIdentifier", "")
        if not re.fullmatch(r"[a-z0-9]+(\.[a-z0-9-]+)+", bid):
            raise SystemExit(f"bad CFBundleIdentifier: {bid!r}")
        if not bid.startswith("com.github."):
            raise SystemExit(f"bundle id not project-owned: {bid!r}")
        short = str(info.get("CFBundleShortVersionString", ""))
        build = str(info.get("CFBundleVersion", ""))
        def ok(v):
            return v == version or v.startswith(version + ".")
        if not (ok(short) or ok(build)):
            raise SystemExit(f"version mismatch: short={short!r} build={build!r} expected={version!r}")
        print(f"Info.plist OK: id={bid} short={short} build={build}")
        PY
        # --- CORE-4: Mach-O architecture -------------------------------------
        case "$EXPECTED_ARCH" in
          x64|x86_64) want=x86_64 ;;
          arm64)      want=arm64 ;;
          *) echo "unknown expected arch: $EXPECTED_ARCH" >&2; exit 1 ;;
        esac
        arch=$(lipo -archs "$bin")
        echo "lipo -archs: $arch (want $want)"
        case " $arch " in *" $want "*) ;; *) echo "architecture mismatch" >&2; exit 1 ;; esac
        # --- CORE-4: no developer paths in load commands ---------------------
        loads=$(otool -L "$bin" | tail -n +2)
        if printf '%s\n' "$loads" | grep -E "/Users/|${HOME}/" >/dev/null; then
          echo "developer path in Mach-O load commands:" >&2
          printf '%s\n' "$loads" >&2
          exit 1
        fi
        # --- USEFUL-5: DMG mount + .app presence -----------------------------
        dmg=$(ls release-assets/*.dmg 2>/dev/null | head -1 || true)
        if [ -n "$dmg" ]; then
          mnt=$(mktemp -d /tmp/dmgmnt.XXXXXX)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          test -d "$mnt/$(basename "$app")"
          hdiutil detach "$mnt" >/dev/null || hdiutil detach "$mnt" -force >/dev/null
          echo "DMG mounts and contains $(basename "$app")"
        else
          echo "no .dmg produced for this leg (best-effort) -- skipping mount check"
        fi
        # --- USEFUL-4: runtime report from the FINAL extracted payload -------
        scripts/runtime_deps_macos.sh --root verify-macos --out "verify-artifacts/runtime-deps-$PREFIX.json"
        # --- CORE-1/USEFUL-5: bounded GUI launch (8s window) -----------------
        "$bin" &
        gui_pid=$!
        sleep 8
        if kill -0 "$gui_pid" 2>/dev/null; then
          kill -9 "$gui_pid" 2>/dev/null || true
          echo "bounded launch OK: GUI alive after 8s, killed"
        else
          rc=0
          wait "$gui_pid" || rc=$?
          echo "GUI exited rc=$rc"
          test "$rc" -eq 0
        fi
    - name: Upload package artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-${{ matrix.name }}
        path: project/release-assets/*
        if-no-files-found: error
    - name: Upload runtime dependency report
      if: runner.os == 'Windows' || runner.os == 'macOS'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-deps-${{ matrix.name }}
        path: project/verify-artifacts/*.json
        if-no-files-found: error
  # package-smoke: cheap Linux GCC x86_64 packaging smoke that runs on every PR
  # (unless the full-release-test label opts in to the real matrix).

  package-smoke:
    name: Linux GCC x86_64 PR packaging smoke
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-release-test')
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: true
    - name: Restore compiler cache
      id: ccache-restore
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: .ccache
        key: ccache-Linux-Linux-GCC-x64-PR-Release-${{ hashFiles('project/CMakeLists.txt', 'project/cmake/**', 'project/vcpkg.json') }}
        restore-keys: 'ccache-Linux-Linux-GCC-x64-PR-Release-

          '
    - name: Install dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y ninja-build ccache rpm dpkg-dev libwxgtk3.2-dev libgtest-dev

        '
    - name: Configure
      env:
        CC: gcc
        CXX: g++
        RUNNER_OS: Linux
        BUILD_TYPE: Release
        PACKAGE_TOOLCHAIN: gcc
      run: cmake -P ./.github/scripts/configure.cmake
    - name: Build
      env:
        CXX: g++
        RUNNER_OS: Linux
        BUILD_TYPE: Release
      run: cmake -P ./.github/scripts/build.cmake
    - name: Save compiler cache
      if: success() && steps.ccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: .ccache
        key: ccache-Linux-Linux-GCC-x64-PR-Release-${{ hashFiles('project/CMakeLists.txt', 'project/cmake/**', 'project/vcpkg.json') }}
    - name: Test
      env:
        CC: gcc
        CXX: g++
        RUNNER_OS: Linux
        BUILD_TYPE: Release
      run: cmake -P ./.github/scripts/test.cmake
    - name: Install
      run: cmake --install build --prefix instdir --strip
    - name: Package Linux smoke
      run: 'set -euo pipefail

        epoch="$(git log -1 --format=%ct)"

        export SOURCE_DATE_EPOCH="$epoch"

        mkdir -p release-assets

        scripts/make_deterministic_tarball.sh --epoch "$epoch" --input instdir --output "release-assets/linux-gcc-x86_64.tar.gz"

        cpack --config build/CPackConfig.cmake -C Release -G DEB

        cpack --config build/CPackConfig.cmake -C Release -G RPM

        cp build/package/*.deb release-assets/linux-gcc-x86_64.deb

        cp build/package/*.rpm release-assets/linux-gcc-x86_64.rpm

        sha256sum release-assets/* > release-assets/SHA256SUMS

        '
    - name: Upload smoke artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-linux-gcc-x86_64-pr-smoke
        path: release-assets/*
        if-no-files-found: error
  # source: builds the release source archives (zip + tar.gz) used to derive
  # the canonical version string and to seed the artifact inventory.

  source:
    needs: cache-gate
    name: Source archives
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-release-test')
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        path: project
    - name: Resolve version
      working-directory: project
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          version="${version:-0.0.0}"
        fi
        echo "VERSION=$version" >> "$GITHUB_ENV"
        echo "resolved version: $version"
    - name: Create source archives
      working-directory: project
      run: 'mkdir -p ../source-assets

        git archive --format=zip --prefix="cpp-project-template_${VERSION}_source/" HEAD > "../source-assets/cpp-project-template_${VERSION}_source.zip"

        git archive --format=tar.gz --prefix="cpp-project-template_${VERSION}_source/" HEAD > "../source-assets/cpp-project-template_${VERSION}_source.tar.gz"

        '
    - name: Upload source artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: source-archives
        path: source-assets/*
        if-no-files-found: error
  # validate-release: contract-driven validation of the staged release
  # (CORE-5/6/8/10, USEFUL-3/4/7). The expected inventory comes from
  # packaging/release-contract.tsv through scripts/release_contract.sh --
  # this job never hardcodes package counts.
  validate-release:
    name: Validate release inventory
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-release-test'))
    needs:
      - package
      - expanded-package
      - source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Download source artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-archives
          path: release-assets
      - name: Download runtime dependency reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: runtime-deps-*
          path: runtime-deps
          merge-multiple: true
      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Non-tag runs (workflow_dispatch/PR validation): nearest release tag
            # only -- CMake project(VERSION) rejects describe output with commit
            # counts (0.0.9-13-g...), so it must never reach configure.
            version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
            version="${version:-0.0.0}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "resolved version: $version"
      - name: Contract inventory and forbidden formats (CORE-5/8)
        shell: bash
        run: |
          set -euo pipefail
          scripts/release_contract.sh check --dir release-assets --version "$VERSION" --scope github-packages
          scripts/release_contract.sh check-forbidden --dir release-assets
      - name: Write global SHA256SUMS
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          files=()
          for f in *.zip *.tar.gz *.deb *.rpm *.exe *.msi *.dmg; do
            [ -f "$f" ] && files+=("$f")
          done
          printf '%s\0' "${files[@]}" | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Validate structure, safety and package metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-meta
          scripts/validate_release_artifacts.sh --dir release-assets --version "$VERSION" --scope github-packages --evidence release-meta/validate-release.json
      - name: Verify identity and version contract (CORE-10)
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify_release_identity.sh --repo . --version "$VERSION" --evidence release-meta/identity.json
      - name: Secret, integrity and manifest scan (USEFUL-7)
        shell: bash
        run: |
          set -euo pipefail
          hits=0
          pattern='AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|xox[baprs]-|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'
          if grep -RIn --binary-files=without-match -E "$pattern" release-assets; then
            echo 'secret-like token found inside release payloads' >&2; hits=1
          fi
          if grep -RIn --binary-files=without-match -E "$pattern" .github .gitlab scripts cmake packaging CMakeLists.txt; then
            echo 'secret-like token found in the repository surface' >&2; hits=1
          fi
          junk=$(find release-assets -maxdepth 1 -type f \( -name '*.pdb' -o -name '*.ilk' -o -name '*.tmp' -o -name '*~' -o -name '*.swp' -o -name '.DS_Store' \) -print)
          if [ -n "$junk" ]; then
            echo "debug/temp artifacts staged: $junk" >&2; hits=1
          fi
          test "$hits" -eq 0
          echo 'secret/integrity scan: clean'
      - name: ELF runtime dependency report (USEFUL-4)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-meta
          scripts/runtime_deps_elf.sh --dir release-assets --out release-meta/runtime-deps-elf.json
      - name: Runtime report coverage (USEFUL-4)
        shell: bash
        run: |
          set -euo pipefail
          # one report per Windows/macOS contract leg, produced by the package jobs
          expected=$(scripts/release_contract.sh list --format tsv \
            | awk -F'\t' '/^#/ || /^os\t/ || NF < 6 { next } $1 == "windows" || $1 == "macos" { print $1 "/" $2 "/" $3 }' \
            | sort -u | wc -l | tr -d ' ')
          found=$(find runtime-deps -type f -name 'runtime-deps-*.json' ! -name 'install-tree-*' | wc -l | tr -d ' ')
          echo "runtime dependency reports: found=$found expected=$expected"
          test "$found" -eq "$expected"
          find runtime-deps -type f | sort
      - name: Generate SBOM (USEFUL-6)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: release-sbom.spdx.json
          upload-artifact: true
      - name: Upload validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-evidence
          path: release-meta/*
          if-no-files-found: error
      - name: Upload runtime dependency reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-deps-evidence
          path: runtime-deps/**/*.json
          if-no-files-found: error

  # publish: tag-only. Re-validates the frozen candidate set against the
  # contract's github-full scope, publishes exactly that set once (no
  # same-name overwrite can exist), then attests and re-verifies the
  # published bytes against the pre-publication digests (CORE-6, USEFUL-6/8).
  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
    - validate-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Download package artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        path: release-assets
        pattern: release-*
        merge-multiple: true
    - name: Download source artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: source-archives
        path: release-assets
    - name: Download validation evidence
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: validation-evidence
        path: release-meta
    - name: Assemble final candidate set (CORE-6)
      shell: bash
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        echo "VERSION=$version" >> "$GITHUB_ENV"
        mkdir -p release-meta
        # contract + consumer verifier ship with the release itself so
        # verification works without checking out the repository (USEFUL-8)
        cp packaging/release-contract.tsv release-assets/release-contract.tsv
        cp scripts/verify_release.sh release-assets/verify-release.sh
        chmod +x release-assets/verify-release.sh
        scripts/release_contract.sh json --scope github-full --version "$version" > release-meta/contract.json
        python3 - release-assets release-meta "$version" "$GITHUB_SHA" > release-assets/release-evidence.json <<'PY'
        import datetime, hashlib, json, os, sys
        directory, meta, version, commit = sys.argv[1:5]
        digests = {}
        for name in sorted(os.listdir(directory)):
            if name in ("release-evidence.json", "SHA256SUMS"):
                continue
            path = os.path.join(directory, name)
            if not os.path.isfile(path):
                continue
            h = hashlib.sha256()
            with open(path, "rb") as fh:
                for chunk in iter(lambda: fh.read(1 << 20), b""):
                    h.update(chunk)
            digests[name] = h.hexdigest()
        with open(os.path.join(meta, "contract.json"), encoding="utf-8") as fh:
            contract = json.load(fh)
        run_id = os.environ.get("GITHUB_RUN_ID", "")
        evidence = {
            "schema": "cpp-project-template.release-evidence.v1",
            "version": version,
            "sourceCommit": commit,
            "repository": os.environ.get("GITHUB_REPOSITORY", ""),
            "runId": run_id,
            "runUrl": "%s/%s/actions/runs/%s" % (
                os.environ.get("GITHUB_SERVER_URL", ""),
                os.environ.get("GITHUB_REPOSITORY", ""),
                run_id),
            "createdAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "contract": contract,
            "artifactCount": len(digests),
            "digests": digests,
            "validation": {
                "inventory": "scripts/release_contract.sh check (validate-release job)",
                "structure": "release-meta/validate-release.json",
                "identity": "release-meta/identity.json",
                "runtimeDependencies": "runtime-deps-evidence artifact (PE/ELF/macOS reports)",
                "sbom": "release-sbom.spdx.json",
                "provenance": "actions/attest-build-provenance, verified after upload with gh attestation verify",
            },
        }
        json.dump(evidence, sys.stdout, indent=2, sort_keys=True)
        sys.stdout.write("\n")
        PY
    - name: Write global SHA256SUMS over the frozen candidate set
      working-directory: release-assets
      shell: bash
      run: |
        set -euo pipefail
        rm -f SHA256SUMS
        files=()
        for f in *; do
          [ -f "$f" ] && files+=("$f")
        done
        printf '%s\0' "${files[@]}" | sort -z | xargs -0 sha256sum > SHA256SUMS
        sha256sum -c SHA256SUMS
    - name: Final contract and artifact validation (github-full)
      shell: bash
      run: |
        set -euo pipefail
        scripts/release_contract.sh check --dir release-assets --version "$VERSION" --scope github-full
        scripts/release_contract.sh check-forbidden --dir release-assets
        scripts/validate_release_artifacts.sh --dir release-assets --version "$VERSION" --scope github-full --evidence release-meta/final-validate.json
        scripts/verify_release_identity.sh --repo . --version "$VERSION" --evidence release-meta/final-identity.json
    - name: Freeze pre-publication digests (CORE-6)
      shell: bash
      run: |
        set -euo pipefail
        (cd release-assets && for f in *; do [ -f "$f" ] && sha256sum "$f"; done) \
          | LC_ALL=C sort -k2 > pre-publish-digests.txt
        echo "frozen $(wc -l < pre-publish-digests.txt | tr -d ' ') candidate file(s)"
    - name: Refuse to touch an existing release (CORE-6 immutability)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release $GITHUB_REF_NAME already exists; refusing to publish (no same-name overwrite)." >&2
          exit 1
        fi
        echo "no existing release for $GITHUB_REF_NAME; publish is a create"
    - name: Publish GitHub release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
      with:
        files: release-assets/*
        fail_on_unmatched_files: true
        token: ${{ github.token }}
        generate_release_notes: true
        body: 'This release contains the validated cross-platform package matrix, source archives, checksums, release contract, evidence, SBOM and consumer verifier.'
    - name: Attest build provenance (USEFUL-6)
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'release-assets/*'
    - name: Verify published bytes, attestations and consumer path (CORE-6/USEFUL-6/8)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        mkdir -p published
        gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published --clobber
        # 1. every published byte equals the frozen pre-publication candidate
        (cd published && sha256sum -c ../pre-publish-digests.txt)
        # 2. the published file set is exactly the frozen set (no strays)
        (cd published && ls | LC_ALL=C sort) > published.list
        (cd release-assets && ls | LC_ALL=C sort) > candidate.list
        diff -u candidate.list published.list
        # 3. provenance attestations verify for the published artifacts
        verified=0
        for f in published/*; do
          case "$f" in
            *.zip|*.tar.gz|*.deb|*.rpm|*.exe|*.msi|*.dmg)
              gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --format json >/dev/null
              verified=$((verified + 1)) ;;
          esac
        done
        echo "attestations verified for $verified packaged artifact(s)"
        # 4. the shipped consumer verifier passes against the published set
        bash published/verify-release.sh --dir published --version "$version"
    - name: Publish summary
      shell: bash
      run: |
        {
          echo "## Release ${GITHUB_REF_NAME} published"
          echo
          echo "- source commit: \`${GITHUB_SHA}\`"
          echo "- candidate files frozen before upload: $(wc -l < pre-publish-digests.txt | tr -d ' ')"
          echo "- post-publication digests: verified against the frozen set"
          echo "- provenance: attested and verified with \`gh attestation verify\`"
          echo "- inventory: \`packaging/release-contract.tsv\` (scope github-full)"
        } >> "$GITHUB_STEP_SUMMARY"

  # expanded-package: fills the remainder of the artifact matrix (Windows ARM64,
  # Linux Clang/32-bit, macOS variants) so the inventory totals the 54 package
  # rows defined by packaging/release-contract.tsv.

  expanded-package:
    needs: cache-gate
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows MSVC ARM64
          os: windows-11-arm
          compiler: msvc
          cc: cl
          cxx: cl
          arch: arm64
          vcpkg_triplet: arm64-windows
          vcpkg_host_triplet: arm64-windows
          external_triplets: false
          environment_script: vcvars-arm64.bat
          cache_id: windows-msvc-arm64
          windows_installers: true
        - name: Windows CLANGARM64 MinGW
          os: windows-11-arm
          compiler: clangarm64
          cc: clang
          cxx: clang++
          arch: arm64
          use_vcpkg: OFF
          msys2_msystem: CLANGARM64
          msys2_toolchain: mingw-w64-clang-aarch64-toolchain
          msys2_packages: wxwidgets3.2-msw:p gtest:p
          msys2_bin: clangarm64/bin
          cache_id: windows-clangarm64
          windows_installers: true
        - name: Windows LLVM ARM64
          os: windows-11-arm
          compiler: llvm
          cc: clang-cl
          cxx: clang-cl
          arch: arm64
          vcpkg_triplet: arm64-windows
          vcpkg_host_triplet: arm64-windows
          external_triplets: false
          environment_script: vcvars-arm64.bat
          cache_id: windows-llvm-arm64
        - name: Linux GCC x86
          os: ubuntu-24.04
          compiler: gcc
          cc: gcc
          cxx: g++
          arch: x86
          linux_multilib: true
          cache_id: linux-gcc-x86
        - name: Linux Clang x64
          os: ubuntu-24.04
          compiler: clang
          cc: clang
          cxx: clang++
          arch: x64
          linux_multilib: false
          cache_id: linux-clang-x64
        - name: Linux Clang ARM64
          os: ubuntu-24.04-arm
          compiler: clang
          cc: clang
          cxx: clang++
          arch: arm64
          linux_multilib: false
          cache_id: linux-clang-arm64
        - name: macOS Apple Clang x64
          os: macos-15-intel
          compiler: apple-clang
          cc: clang
          cxx: clang++
          arch: x64
          cache_id: macos-apple-clang-x64
        - name: macOS GCC x64
          os: macos-15-intel
          compiler: gcc
          cc: gcc
          cxx: g++
          arch: x64
          build_projectwx: 'OFF'
          build_testing: 'OFF'
          cache_id: macos-gcc-x64
        - name: macOS GCC ARM64
          os: macos-latest
          compiler: gcc
          cc: gcc
          cxx: g++
          arch: arm64
          build_projectwx: 'OFF'
          build_testing: 'OFF'
          cache_id: macos-gcc-arm64
        - name: macOS LLVM x64
          os: macos-15-intel
          compiler: llvm
          cc: clang
          cxx: clang++
          arch: x64
          cache_id: macos-llvm-x64
        - name: macOS LLVM ARM64
          os: macos-latest
          compiler: llvm
          cc: clang
          cxx: clang++
          arch: arm64
          cache_id: macos-llvm-arm64
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        submodules: false
        path: project
        show-progress: false
    # CORE-10/P0-6: same version/epoch resolution as the `package` job,
    # before configure, so CPack and the archives agree on one identity.
    - name: Resolve release version, epoch and naming
      working-directory: project
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          # Non-tag runs (workflow_dispatch/PR validation): nearest release tag
          # only -- CMake project(VERSION) rejects describe output with commit
          # counts (0.0.9-13-g...), so it must never reach configure.
          version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
          version="${version:-0.0.0}"
        fi
        epoch="$(git log -1 --format=%ct)"
        case "${{ runner.os }}" in
          Linux) platform="linux" ;;
          Windows) platform="windows" ;;
          macOS) platform="macos" ;;
          *) echo "unsupported runner OS ${{ runner.os }}" >&2; exit 1 ;;
        esac
        case "${{ matrix.arch }}" in
          x64) package_arch="x86_64" ;;
          x86) package_arch="i686" ;;
          arm64) package_arch="arm64" ;;
          *) echo "unsupported arch ${{ matrix.arch }}" >&2; exit 1 ;;
        esac
        {
          echo "VERSION=$version"
          echo "SOURCE_DATE_EPOCH=$epoch"
          echo "CPP_PROJECT_TEMPLATE_VERSION=$version"
          echo "RELEASE_PREFIX=cpp-project-template_${version}_${platform}-${{ matrix.compiler }}-${package_arch}"
        } >> "$GITHUB_ENV"
        echo "version=$version epoch=$epoch"
    - name: Restore compiler cache
      id: ccache-restore
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ matrix.name }}-Release-${{ hashFiles('project/CMakeLists.txt', 'project/cmake/**', 'project/vcpkg.json') }}
        restore-keys: ccache-${{ runner.os }}-${{ matrix.name }}-Release-
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: "sudo apt-get update\nif [[ \"${{ matrix.linux_multilib }}\" == \"true\" ]]; then\n  sudo dpkg --add-architecture i386\n  sudo apt-get update\n\
        \  sudo apt-get install -y ninja-build ccache pkg-config rpm dpkg-dev gcc-multilib g++-multilib libwxgtk3.2-dev:i386 libgtest-dev:i386\n  echo \"CFLAGS=-m32\"\
        \ >> \"$GITHUB_ENV\"\n  echo \"CXXFLAGS=-m32\" >> \"$GITHUB_ENV\"\n  echo \"LDFLAGS=-m32\" >> \"$GITHUB_ENV\"\n  echo \"PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig\"\
        \ >> \"$GITHUB_ENV\"\nelse\n  sudo apt-get install -y ninja-build ccache pkg-config rpm dpkg-dev libwxgtk3.2-dev libgtest-dev\nfi\nif [[ \"${{ matrix.compiler\
        \ }}\" == \"clang\" ]]; then\n  sudo apt-get install -y clang\nfi\n"
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: "brew install ninja ccache wxwidgets googletest\nif [[ \"${{ matrix.compiler }}\" == \"gcc\" ]]; then\n  brew install gcc\n  gcc_prefix=\"$(brew\
        \ --prefix gcc)\"\n  gcc_major=\"$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)\"\n  echo \"CC=${gcc_prefix}/bin/gcc-${gcc_major}\"\
        \ >> \"$GITHUB_ENV\"\n  echo \"CXX=${gcc_prefix}/bin/g++-${gcc_major}\" >> \"$GITHUB_ENV\"\nelif [[ \"${{ matrix.compiler }}\" == \"llvm\" ]]; then\n\
        \  brew install llvm\n  llvm_prefix=\"$(brew --prefix llvm)\"\n  test -x \"$llvm_prefix/bin/clang\"\n  test -x \"$llvm_prefix/bin/clang++\"\n  echo\
        \ \"CC=${llvm_prefix}/bin/clang\" >> \"$GITHUB_ENV\"\n  echo \"CXX=${llvm_prefix}/bin/clang++\" >> \"$GITHUB_ENV\"\n  echo \"PATH=${llvm_prefix}/bin:$PATH\"\
        \ >> \"$GITHUB_ENV\"\nfi\n"
    - name: Install Windows tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install ninja ccache nsis 7zip wixtoolset -y --no-progress
    - name: Refresh Windows environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Test-Path "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1") {
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
        }
        7z | Select-Object -First 1
        $candle = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $candle) {
          $candle = Get-ChildItem -Path "$env:ProgramFiles\WiX Toolset*\bin\candle.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if (-not $candle) {
          $candle = Get-ChildItem -Path "$env:ChocolateyInstall\lib\wixtoolset" -Filter candle.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
        }
        if (-not $candle) { throw "WiX candle.exe not found after wixtoolset installation" }
        $candle.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        & $candle.FullName -?
    - name: Setup MSYS2 MinGW
      id: msys2
      if: runner.os == 'Windows' && matrix.compiler == 'mingw'
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
      with:
        msystem: ${{ matrix.msys2_msystem }}
        update: false
        path-type: minimal
        install: ${{ matrix.msys2_toolchain }}
    - name: Setup MSYS2 CLANGARM64
      id: msys2-arm64
      if: runner.os == 'Windows' && matrix.compiler == 'clangarm64'
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
      with:
        msystem: CLANGARM64
        update: false
        release: false
        cache: true
        path-type: minimal
        install: ${{ matrix.msys2_toolchain }}
        pacboy: ${{ matrix.msys2_packages }}
    - name: Add MSYS2 compiler to PATH
      if: runner.os == 'Windows' && (matrix.compiler == 'mingw' || matrix.compiler == 'clangarm64')
      shell: pwsh
      run: "if (\"${{ matrix.compiler }}\" -eq \"clangarm64\") {\n  $msysRoot = \"${{ steps.msys2-arm64.outputs.msys2-location }}\"\n} else {\n  $msysRoot\
        \ = \"${{ steps.msys2.outputs.msys2-location }}\"\n}\nif (-not $msysRoot) { throw \"MSYS2 location output was empty\" }\n$bin = Join-Path $msysRoot\
        \ \"${{ matrix.msys2_bin }}\"\nif (-not (Test-Path $bin)) { throw \"MSYS2 compiler directory not found: $bin\" }\n$bin | Out-File -FilePath $env:GITHUB_PATH\
        \ -Append -Encoding utf8\nif (\"${{ matrix.compiler }}\" -eq \"clangarm64\") {\n  $prefix = Join-Path $msysRoot \"clangarm64\"\n  \"CMAKE_PREFIX_PATH=$prefix\"\
        \ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n}\n"
    - name: Locate Visual Studio environment
      if: runner.os == 'Windows' && (matrix.compiler == 'msvc' || matrix.compiler == 'llvm')
      shell: pwsh
      run: "$vswhere = \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\"\nif (-not (Test-Path $vswhere)) {\n  $vswhere = \"\
        $env:ProgramFiles\\Microsoft Visual Studio\\Installer\\vswhere.exe\"\n}\nif (-not (Test-Path $vswhere)) { throw \"vswhere.exe not found\" }\nif\
        \ (\"${{ matrix.arch }}\" -eq \"arm64\") {\n  $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64\
        \ -property installationPath\n  if (-not $vsRoot) { throw \"Native ARM64 MSVC toolset not found\" }\n  $vsRoot = ($vsRoot | Select-Object -First\
        \ 1).Trim()\n  $vsDevCmd = Join-Path $vsRoot \"Common7\\Tools\\VsDevCmd.bat\"\n  $wrapper = Join-Path $env:GITHUB_WORKSPACE \"vs-arm64-env.bat\"\
        \n  Set-Content -Path $wrapper -Value \"@echo off\" -Encoding ascii\n  Add-Content -Path $wrapper -Value ('call \"' + $vsDevCmd + '\" -arch=arm64\
        \ -host_arch=arm64') -Encoding ascii\n  \"ENVIRONMENT_SCRIPT=$wrapper\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n} else {\n\
        \  $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath\n  if (-not $vsRoot)\
        \ { throw \"Visual Studio C++ toolset not found\" }\n  $vsRoot = ($vsRoot | Select-Object -First 1).Trim()\n  $script = Join-Path $vsRoot \"VC\\\
        Auxiliary\\Build\\${{ matrix.environment_script }}\"\n  if (-not (Test-Path $script)) { throw \"Expected environment script not found at $script\"\
        \ }\n  \"ENVIRONMENT_SCRIPT=$script\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n}\n"
    - name: Get custom Windows vcpkg triplets
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64' && matrix.external_triplets == true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: Neumann-A/my-vcpkg-triplets
        ref: ${{ env.MY_VCPKG_TRIPLETS_COMMIT }}
        path: my-vcpkg-triplets
        fetch-depth: 1
    - name: Resolve expanded Windows vcpkg cache key
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
      shell: bash
      run: |
        case "${{ matrix.compiler }}" in
          msvc) echo "VCPKG_CACHE_PREFIX=windows-${VCPKG_CACHE_NAMESPACE}-${{ matrix.arch }}-Release" >> "$GITHUB_ENV" ;;
          mingw) echo "VCPKG_CACHE_PREFIX=windows-mingw-${VCPKG_CACHE_NAMESPACE}-${{ matrix.arch }}-Release" >> "$GITHUB_ENV" ;;
          llvm) if [ "${{ matrix.arch }}" = "arm64" ]; then echo "VCPKG_CACHE_PREFIX=windows-${VCPKG_CACHE_NAMESPACE}-arm64-Release" >> "$GITHUB_ENV"; else echo "VCPKG_CACHE_PREFIX=windows-llvm-${VCPKG_CACHE_NAMESPACE}-${MY_VCPKG_TRIPLETS_COMMIT}-${{ matrix.arch }}-Release" >> "$GITHUB_ENV"; fi ;;
          *) echo "Unsupported Windows vcpkg compiler: ${{ matrix.compiler }}" >&2; exit 1 ;;
        esac
    - name: Restore Windows vcpkg binary cache
      id: vcpkg-cache-restore
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: project/vcpkg_cache
        key: ${{ env.VCPKG_CACHE_PREFIX  }}-${{ hashFiles('project/vcpkg.json')  }}
        restore-keys: |
          ${{ env.VCPKG_CACHE_PREFIX  }}-
          vcpkg-experimental-${{ matrix.cache_id  }}-${{ env.VCPKG_GIT_REF  }}-${{ env.MY_VCPKG_TRIPLETS_COMMIT  }}-${{ matrix.vcpkg_triplet  }}-

    - name: Checkout Windows vcpkg
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: microsoft/vcpkg
        ref: ${{ env.VCPKG_GIT_REF }}
        path: vcpkg
        fetch-depth: 1
    - name: Restore Windows vcpkg tool cache
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
      id: vcpkg-tool-cache
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: vcpkg/vcpkg.exe
        key: vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
        restore-keys: |
          vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-
    - name: Bootstrap Windows vcpkg
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64' && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: vcpkg
      run: .\bootstrap-vcpkg.bat -disableMetrics
    - name: Verify Windows vcpkg tool
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
      shell: pwsh
      run: |
        if (-not (Test-Path .\vcpkg\vcpkg.exe)) { throw 'vcpkg.exe was not restored or bootstrapped' }
        & .\vcpkg\vcpkg.exe version
    - name: Restore vcpkg download cache
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
      id: vcpkg-download-cache
      uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: vcpkg_downloads
        key: vcpkg-downloads-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ matrix.compiler }}-${{ matrix.arch }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
        restore-keys: |
          vcpkg-downloads-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-
    - name: vcpkg
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
      shell: pwsh
      env:
        VCPKG_MANIFEST_MODE: OFF
        VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\project\vcpkg_cache,readwrite
        VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg_downloads
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      run: |
        $installArgs = @('--triplet', '${{ matrix.vcpkg_triplet }}', 'wxwidgets', 'gtest')
        if ("${{ matrix.external_triplets }}" -eq "true") {
          $installArgs = @('--triplet', '${{ matrix.vcpkg_triplet }}', '--overlay-triplets=${{ github.workspace }}\my-vcpkg-triplets', 'wxwidgets', 'gtest')
        }
        $lastExitCode = 1
        for ($attempt = 1; $attempt -le 5; $attempt++) {
          & .\vcpkg\vcpkg.exe install @installArgs
          $lastExitCode = $LASTEXITCODE
          if ($lastExitCode -eq 0) { break }
          if ($attempt -lt 5) {
            Write-Host "vcpkg install failed with exit code $lastExitCode; retrying attempt $($attempt + 1)/5..."
            Start-Sleep -Seconds ([int][Math]::Pow(2, $attempt))
          }
        }
        if ($lastExitCode -ne 0) { throw "vcpkg install failed after 5 attempts with exit code $lastExitCode" }
    - name: Save vcpkg download cache
      if: always() && runner.os == 'Windows' && matrix.compiler != 'clangarm64' && steps.vcpkg-download-cache.outputs.cache-hit != 'true' && hashFiles('vcpkg_downloads/**') != ''
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: vcpkg_downloads
        key: vcpkg-downloads-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ matrix.compiler }}-${{ matrix.arch }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
    - name: Save Windows vcpkg tool cache
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64' && success() && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: vcpkg/vcpkg.exe
        key: vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
    - name: Save Windows vcpkg binary cache
      if: runner.os == 'Windows' && matrix.compiler != 'clangarm64' && success() && steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: project/vcpkg_cache
        key: ${{ env.VCPKG_CACHE_PREFIX }}-${{ hashFiles('project/vcpkg.json') }}
    - name: Configure
      working-directory: project
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        RUNNER_OS: ${{ runner.os }}
        ENVIRONMENT_SCRIPT: ${{ env.ENVIRONMENT_SCRIPT }}
        VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
        USE_VCPKG: ${{ matrix.use_vcpkg }}
        PACKAGE_TOOLCHAIN: ${{ matrix.compiler }}
        BUILD_TYPE: Release
        BUILD_PROJECTWX: ${{ matrix.build_projectwx }}
        BUILD_TESTING: ${{ matrix.build_testing }}
      run: cmake -P ./.github/scripts/configure.cmake
    - name: Verify configured compiler
      working-directory: project
      shell: bash
      run: "cxx_bin=\"$(sed -n 's/^CMAKE_CXX_COMPILER:FILEPATH=//p' build/CMakeCache.txt | head -1)\"\ntest -n \"$cxx_bin\"\ntest -x \"$cxx_bin\"\necho\
        \ \"Configured CXX: $cxx_bin\"\nif [[ \"${{ matrix.compiler }}\" == \"msvc\" ]]; then\n  CXX_BIN=\"$cxx_bin\" powershell -NoProfile -Command '\n\
        \    & \"$env:CXX_BIN\" /?\n    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n  '\nelse\n  \"$cxx_bin\" --version\nfi\n"
    - name: Build
      working-directory: project
      env:
        CXX: ${{ matrix.cxx }}
        RUNNER_OS: ${{ runner.os }}
        ENVIRONMENT_SCRIPT: ${{ env.ENVIRONMENT_SCRIPT }}
        BUILD_TYPE: Release
      run: cmake -P ./.github/scripts/build.cmake
    - name: Save compiler cache
      if: success() && steps.ccache-restore.outputs.cache-hit != 'true' && hashFiles('.ccache/**') != ''
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ matrix.name }}-Release-${{ hashFiles('project/CMakeLists.txt', 'project/cmake/**', 'project/vcpkg.json') }}
    - name: Test
      if: matrix.build_testing != 'OFF'
      working-directory: project
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        RUNNER_OS: ${{ runner.os }}
        BUILD_TYPE: Release
      run: cmake -P ./.github/scripts/test.cmake
    - name: Install
      working-directory: project
      run: cmake --install build --prefix instdir --strip --config Release
    - name: Verify binary architecture
      working-directory: project
      shell: bash
      run: "if [[ \"$RUNNER_OS\" == \"Windows\" ]]; then\n  powershell -NoProfile -Command '\n    $exe = Get-ChildItem -Recurse -File build\\bin -Filter\
        \ projectcli.exe | Select-Object -First 1\n    if (-not $exe) { throw \"projectcli.exe not found\" }\n    $bytes = [IO.File]::ReadAllBytes($exe.FullName)\n\
        \    if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {\n      throw \"Not a valid PE executable: $($exe.FullName)\"\n  \
        \  }\n    $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)\n    if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {\n      throw \"Invalid\
        \ PE header offset: $peOffset\"\n    }\n    if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or\n        $bytes[$peOffset + 2]\
        \ -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {\n      throw \"Invalid PE signature\"\n    }\n    $machine = [BitConverter]::ToUInt16($bytes, $peOffset\
        \ + 4)\n    $expected = switch (\"${{ matrix.arch }}\") {\n      \"arm64\" { [UInt16]0xAA64 }\n      \"x86\"   { [UInt16]0x014C }\n      default\
        \ { [UInt16]0x8664 }\n    }\n    if ($machine -ne $expected) {\n      throw (\"Expected {0} PE (0x{1:X4}), got 0x{2:X4}\" -f \"${{ matrix.arch }}\"\
        , $expected, $machine)\n    }\n    \"Verified $($exe.FullName): PE machine 0x{0:X4}\" -f $machine\n  '\nelse\n  target=\"$(find build/bin -maxdepth\
        \ 1 -type f -perm -111 -print -quit)\"\n  test -n \"$target\"\n  file \"$target\"\n  case \"${{ matrix.arch }}\" in\n    x86) file \"$target\" |\
        \ grep -Eq '32-bit|Intel 80386' ;;\n    arm64) file \"$target\" | grep -Eiq 'arm aarch64|arm64' ;;\n    x64) file \"$target\" | grep -Eq 'x86-64|x86_64|Mach-O\
        \ 64-bit executable x86_64' ;;\n    *) exit 1 ;;\n  esac\nfi\n"
    - name: Determine canonical package name
      id: package_name
      working-directory: project
      shell: bash
      run: 'base=$(sed -n ''s/.*CPACK_PACKAGE_FILE_NAME "\([^"]*\)".*/\1/p'' build/CPackConfig.cmake | head -1)

        test -n "$base"

        echo "base=$base" >> "$GITHUB_OUTPUT"

        '
    - name: Package Windows
      if: runner.os == 'Windows'
      working-directory: project
      shell: pwsh
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
        BASE: ${{ steps.package_name.outputs.base }}
      run: |

        New-Item -ItemType Directory -Force release-assets | Out-Null

        & .\scripts\make_deterministic_zip.ps1 -InputDir instdir -OutputPath "release-assets\$env:PREFIX.zip" -Epoch ([int]$env:SOURCE_DATE_EPOCH)

        Push-Location build
        cpack --config CPackConfig.cmake -C Release -G NSIS64
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path "package\$env:BASE.exe")) { throw 'NSIS64 package generation failed' }
        Copy-Item "package\$env:BASE.exe" "..\release-assets\${env:PREFIX}_nsis.exe" -Force

        cpack --config CPackConfig.cmake -C Release -G WIX
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path "package\$env:BASE.msi")) { throw 'MSI package generation failed' }
        Copy-Item "package\$env:BASE.msi" "..\release-assets\${env:PREFIX}_wix.msi" -Force
        Pop-Location
    - name: Package Linux
      if: runner.os == 'Linux'
      working-directory: project
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
      run: 'mkdir -p release-assets

        scripts/make_deterministic_tarball.sh --epoch "$SOURCE_DATE_EPOCH" --input instdir --output "release-assets/${PREFIX}.tar.gz"

        cpack --config build/CPackConfig.cmake -C Release -G DEB

        cpack --config build/CPackConfig.cmake -C Release -G RPM

        deb=$(find build/package -maxdepth 1 -type f -name ''*.deb'' | head -1)

        rpm=$(find build/package -maxdepth 1 -type f -name ''*.rpm'' | head -1)

        test -n "$deb" && test -n "$rpm"

        cp "$deb" "release-assets/${PREFIX}.deb"

        cp "$rpm" "release-assets/${PREFIX}.rpm"

        '
    - name: Package macOS
      if: runner.os == 'macOS'
      working-directory: project
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
      run: |
        mkdir -p release-assets

        pwsh -NoProfile -File scripts/make_deterministic_zip.ps1 -InputDir instdir -OutputPath "release-assets/${PREFIX}.zip" -Epoch "$SOURCE_DATE_EPOCH"

        cpack_ok=0
        for attempt in 1 2 3; do
          if cpack --config build/CPackConfig.cmake -C Release -G DragNDrop; then
            cpack_ok=1
            break
          fi
          # CPack can transiently leave the temporary DMG mounted when hdiutil
          # reports a busy-detach failure. Force-detach before retrying.
          hdiutil detach /Volumes/cpp-project-template -force >/dev/null 2>&1 || true
          sleep $((attempt * 2))
        done
        if [[ "$cpack_ok" != "1" ]]; then
          echo "CPack DragNDrop failed after 3 attempts" >&2
          exit 1
        fi

        dmg=$(find build/package -maxdepth 1 -type f -name ''*.dmg'' | head -1)

        test -n "$dmg"

        cp "$dmg" "release-assets/${PREFIX}.dmg"

    # CORE-1/CORE-2: extract the ZIP candidate and prove the runtime DLL
    # closure plus a bounded CLI smoke straight from the FINAL payload.
    - name: Verify Windows package payload closure
      if: runner.os == 'Windows'
      working-directory: project
      shell: pwsh
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
        EXPECTED_ARCH: ${{ matrix.arch }}
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force verify-artifacts | Out-Null
        $want = switch ($env:EXPECTED_ARCH) {
          'x64' { 'x86_64' }
          'x86' { 'i686' }
          'arm64' { 'arm64' }
          default { throw "unknown arch $($env:EXPECTED_ARCH)" }
        }
        $zip = "release-assets\$env:PREFIX.zip"
        if (-not (Test-Path $zip)) { throw "zip not found: $zip" }
        if (Test-Path verify-zip) { Remove-Item -Recurse -Force verify-zip }
        Expand-Archive -Path $zip -DestinationPath verify-zip
        & .\cmake\windows\Resolve-WindowsRuntimeDeps.ps1 -Root verify-zip -ExpectedArch $want -Report "verify-artifacts\runtime-deps-$env:PREFIX.json"
        & .\verify-zip\bin\projectcli.exe -v
        if ($LASTEXITCODE -ne 0) { throw "projectcli smoke failed with exit code $LASTEXITCODE" }
        if (Test-Path "build\windows-runtime-dependencies.json") {
          Copy-Item "build\windows-runtime-dependencies.json" "verify-artifacts\install-tree-$env:PREFIX.json" -Force
        }
    # CORE-4 + USEFUL-5 (macOS): extract the ZIP candidate, assert the
    # .app contract (structure, Info.plist identity + version, Mach-O
    # architecture, no developer paths in load commands), mount + inspect
    # the DMG, generate the USEFUL-4 runtime report from the FINAL shipped
    # payload (not the build tree), and perform a bounded GUI launch.
    - name: Verify macOS package payload
      if: runner.os == 'macOS'
      working-directory: project
      shell: bash
      env:
        PREFIX: ${{ env.RELEASE_PREFIX }}
        EXPECTED_ARCH: ${{ matrix.arch }}
        EXPECTED_VERSION: ${{ env.VERSION }}
      run: |
        set -euo pipefail
        mkdir -p verify-artifacts
        zip="release-assets/${PREFIX}.zip"
        test -f "$zip"
        rm -rf verify-macos && mkdir verify-macos
        unzip -q "$zip" -d verify-macos
        # --- CORE-4: .app bundle at payload root -----------------------------
        app=$(find verify-macos -maxdepth 2 -name '*.app' -type d | head -1)
        if [ -z "$app" ]; then
          echo "no .app bundle in zip payload:" >&2
          find verify-macos -maxdepth 3 >&2
          exit 1
        fi
        test -d "$app/Contents/MacOS"
        bin=$(find "$app/Contents/MacOS" -type f | head -1)
        test -n "$bin"
        echo "bundle: $app"
        # --- CORE-4/CORE-10: Info.plist parses, identity + version correct --
        test -f "$app/Contents/Info.plist"
        python3 - "$app/Contents/Info.plist" "$EXPECTED_VERSION" <<'PY'
        import plistlib, re, sys
        path, version = sys.argv[1], sys.argv[2]
        with open(path, "rb") as fh:
            info = plistlib.load(fh)
        bid = info.get("CFBundleIdentifier", "")
        if not re.fullmatch(r"[a-z0-9]+(\.[a-z0-9-]+)+", bid):
            raise SystemExit(f"bad CFBundleIdentifier: {bid!r}")
        if not bid.startswith("com.github."):
            raise SystemExit(f"bundle id not project-owned: {bid!r}")
        short = str(info.get("CFBundleShortVersionString", ""))
        build = str(info.get("CFBundleVersion", ""))
        def ok(v):
            return v == version or v.startswith(version + ".")
        if not (ok(short) or ok(build)):
            raise SystemExit(f"version mismatch: short={short!r} build={build!r} expected={version!r}")
        print(f"Info.plist OK: id={bid} short={short} build={build}")
        PY
        # --- CORE-4: Mach-O architecture -------------------------------------
        case "$EXPECTED_ARCH" in
          x64|x86_64) want=x86_64 ;;
          arm64)      want=arm64 ;;
          *) echo "unknown expected arch: $EXPECTED_ARCH" >&2; exit 1 ;;
        esac
        arch=$(lipo -archs "$bin")
        echo "lipo -archs: $arch (want $want)"
        case " $arch " in *" $want "*) ;; *) echo "architecture mismatch" >&2; exit 1 ;; esac
        # --- CORE-4: no developer paths in load commands ---------------------
        loads=$(otool -L "$bin" | tail -n +2)
        if printf '%s\n' "$loads" | grep -E "/Users/|${HOME}/" >/dev/null; then
          echo "developer path in Mach-O load commands:" >&2
          printf '%s\n' "$loads" >&2
          exit 1
        fi
        # --- USEFUL-5: DMG mount + .app presence -----------------------------
        dmg=$(ls release-assets/*.dmg 2>/dev/null | head -1 || true)
        if [ -n "$dmg" ]; then
          mnt=$(mktemp -d /tmp/dmgmnt.XXXXXX)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          test -d "$mnt/$(basename "$app")"
          hdiutil detach "$mnt" >/dev/null || hdiutil detach "$mnt" -force >/dev/null
          echo "DMG mounts and contains $(basename "$app")"
        else
          echo "no .dmg produced for this leg (best-effort) -- skipping mount check"
        fi
        # --- USEFUL-4: runtime report from the FINAL extracted payload -------
        scripts/runtime_deps_macos.sh --root verify-macos --out "verify-artifacts/runtime-deps-$PREFIX.json"
        # --- CORE-1/USEFUL-5: bounded GUI launch (8s window) -----------------
        "$bin" &
        gui_pid=$!
        sleep 8
        if kill -0 "$gui_pid" 2>/dev/null; then
          kill -9 "$gui_pid" 2>/dev/null || true
          echo "bounded launch OK: GUI alive after 8s, killed"
        else
          rc=0
          wait "$gui_pid" || rc=$?
          echo "GUI exited rc=$rc"
          test "$rc" -eq 0
        fi

    - name: Upload package artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-${{ matrix.name }}
        path: project/release-assets/*
        if-no-files-found: error
    - name: Upload runtime dependency report
      if: runner.os == 'Windows' || runner.os == 'macOS'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: runtime-deps-${{ matrix.name }}
        path: project/verify-artifacts/*.json
        if-no-files-found: error

# =============================================================================
# Clear all GitHub Actions caches
# =============================================================================
# Purpose
# --------
# Manual helper that wipes every Actions cache for the repository. Needed when
# a poisoned/stale cache (e.g. a bad vcpkg binary cache entry) keeps CI failing.
# Also the deliberate way to obtain a genuine cold-cache run for the binary
# cache proofs (issue #152): wipe -> cold run -> warm re-run.
#
# Trigger rules
# -------------
#   * workflow_dispatch only - never runs automatically.
#   * A required ``confirm`` input must be typed exactly as documented below,
#     so a mis-click on the dispatch button cannot wipe the cache (issue #156:
#     two casual wipes on 2026-09-27 left every run cold for hours - 88-118
#     minutes per release until the caches re-seeded).
#
# Cost of wiping
# --------------
#   A wipe deletes the conan (wxWidgets from source), vcpkg, msys2 and ccache
#   families all at once. The next release/conan run is a genuine cold run
#   (recently measured: 88-118 minutes instead of ~8 warm). Prefer fixing a
#   single poisoned key over wiping everything.
#
# Action pin
# ----------
#   easimon/wipe-cache is pinned to the commit the ``v2`` tag points at
#   (verified with ``gh api repos/easimon/wipe-cache/git/ref/tags/v2``);
#   ``action.yml`` at that commit is byte-identical to the upstream default
#   branch, so only the CI workflows upstream changed after v2. The previous
#   pin (9e4f7c0f...) does not exist in the upstream repository at all, so
#   this workflow could never have run -- see docs/PROJECT_DOCUMENTATION.md.
#
# References
# ----------
#   * Manual workflow runs: https://docs.github.com/en/actions/using-workflows/manually-running-a-workflow
#   * Caching dependencies: https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
# =============================================================================

name: Clear all Github actions caches

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type wipe-caches to confirm - this deletes every Actions cache for this repository (next runs are cold: ~90 min instead of ~8)"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  my-job:
    name: Delete all caches
    runs-on: ubuntu-24.04
    steps:
      - name: Require typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "wipe-caches" ]; then
            echo "::error::Refusing to wipe every cache: the 'confirm' input must be exactly 'wipe-caches'. Nothing was deleted."
            exit 1
          fi
          echo "Confirmation accepted - wiping all Actions caches."
      - name: List caches before wiping
        uses: easimon/wipe-cache@e7ab82e64c328fd39c2e96933d426cd72ac2beba # v2
        with:
          dry-run: 'true'
      - name: Clear caches
        uses: easimon/wipe-cache@e7ab82e64c328fd39c2e96933d426cd72ac2beba # v2

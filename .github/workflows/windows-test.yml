# =============================================================================
# Windows CI Test
# =============================================================================
# Purpose
# --------
# Manual Windows Debug build + CTest run using the GitLab-style
# x64-windows-debug vcpkg triplet from .gitlab/vcpkg-triplets. Historically it
# also re-checked parity between the GitLab and GitHub copies of the repository;
# that overlay step is now redundant because both live in this repository.
#
# Trigger rules
# -------------
#   * workflow_dispatch only (deliberate; regular Windows testing runs in ci.yml).
#
# References
# ----------
#   * vcpkg:               https://vcpkg.io
#   * ilammy/msvc-dev-cmd: https://github.com/ilammy/msvc-dev-cmd
#   * CTest:               https://cmake.org/cmake/help/latest/module/CTest.html
# =============================================================================

name: Windows CI Test

# Pre-merge, this workflow cross-validated the GitHub copy's
# .gitlab/vcpkg-triplets against the GitLab copy's full source tree by
# cloning the GitLab repo separately and overlaying the triplets into it.
# Now that both live in one repository, it just builds and tests this repo
# directly with that same triplet -- no separate clone needed.

on:
  workflow_dispatch:

jobs:
  build-windows-x64-debug:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify vcpkg triplet is present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path ".gitlab\vcpkg-triplets\x64-windows-debug.cmake")) {
            Write-Error "x64-windows-debug.cmake is missing"
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          git config --global core.autocrlf false
          git config --global advice.detachedHead false

          $vcpkgRef = "master"

          if (Test-Path "vcpkg.json") {
            $manifest = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json

            if ($manifest.'builtin-baseline') {
              $vcpkgRef = $manifest.'builtin-baseline'
            }
          }

          git init vcpkg
          Set-Location vcpkg

          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch --depth 1 --no-tags origin "$vcpkgRef"
          git checkout FETCH_HEAD

          Set-Location ..

          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "vcpkg_cache" | Out-Null

          $env:VCPKG_BINARY_SOURCES =
            "clear;files,$env:GITHUB_WORKSPACE\vcpkg_cache,readwrite"

          $env:VCPKG_MANIFEST_MODE = "ON"

          .\vcpkg\vcpkg.exe install `
            --triplet x64-windows-debug `
            --overlay-triplets="$env:GITHUB_WORKSPACE\.gitlab\vcpkg-triplets"

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -D CMAKE_BUILD_TYPE=Debug `
            -D VCPKG_TARGET_TRIPLET=x64-windows-debug `
            -D VCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\.gitlab\vcpkg-triplets" `
            -D VCPKG_MANIFEST_MODE=ON `
            -D CMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug -- /m

      - name: Test Debug
        shell: pwsh
        run: |
          cd build
          ctest -C Debug --output-on-failure

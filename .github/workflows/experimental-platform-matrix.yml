name: Experimental All Platforms

on:
  push:
    branches:
      - experimental/all-platforms-architectures-v2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_GIT_REF: e0a6b8572cf0ac716fdc11466522cf744e97e0bd
  MY_VCPKG_TRIPLETS_COMMIT: e5f3f2d06430fa475feccbb34a5d61023807b854
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            arch: x64
            vcpkg_triplet: x64-windows-static
            vcpkg_host_triplet: x64-windows
            external_triplets: true
            environment_script: vcvars64.bat
            cache_id: windows-msvc-x64

          - name: Windows MSVC x86
            os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            arch: x86
            vcpkg_triplet: x86-windows-static
            vcpkg_host_triplet: x64-windows
            external_triplets: true
            environment_script: vcvars32.bat
            cache_id: windows-msvc-x86

          - name: Windows MSVC ARM64
            os: windows-11-arm
            compiler: msvc
            cc: cl
            cxx: cl
            arch: arm64
            vcpkg_triplet: arm64-windows
            vcpkg_host_triplet: arm64-windows
            external_triplets: false
            environment_script: vcvars-arm64.bat
            cache_id: windows-msvc-arm64

          - name: Windows MinGW x64
            os: windows-latest
            compiler: mingw
            cc: gcc
            cxx: g++
            arch: x64
            vcpkg_triplet: x64-mingw-dynamic
            vcpkg_host_triplet: x64-windows
            external_triplets: true
            msys2_msystem: MINGW64
            msys2_toolchain: mingw-w64-x86_64-toolchain
            msys2_bin: mingw64/bin
            cache_id: windows-mingw-x64

          - name: Windows MinGW x86
            os: windows-latest
            compiler: mingw
            cc: gcc
            cxx: g++
            arch: x86
            vcpkg_triplet: x86-mingw-dynamic
            vcpkg_host_triplet: x64-windows
            external_triplets: true
            msys2_msystem: MINGW32
            msys2_toolchain: mingw-w64-i686-toolchain
            msys2_bin: mingw32/bin
            cache_id: windows-mingw-x86

          - name: Windows LLVM x64
            os: windows-latest
            compiler: llvm
            cc: clang-cl
            cxx: clang-cl
            arch: x64
            vcpkg_triplet: x64-win-llvm-release
            vcpkg_host_triplet: x64-windows
            external_triplets: true
            environment_script: vcvars64.bat
            cache_id: windows-llvm-x64

          - name: Windows LLVM x86
            os: windows-latest
            compiler: llvm
            cc: clang-cl
            cxx: clang-cl
            arch: x86
            vcpkg_triplet: x86-win-llvm
            vcpkg_host_triplet: x64-windows
            external_triplets: true
            environment_script: vcvars32.bat
            cache_id: windows-llvm-x86

          - name: Windows CLANGARM64 MinGW
            os: windows-11-arm
            compiler: clangarm64
            cc: clang
            cxx: clang++
            arch: arm64
            use_vcpkg: OFF
            msys2_msystem: CLANGARM64
            msys2_toolchain: mingw-w64-clang-aarch64-toolchain
            msys2_packages: wxwidgets3.2-msw:p gtest:p
            msys2_bin: clangarm64/bin
            cache_id: windows-clangarm64

          - name: Linux GCC x64
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
            arch: x64
            linux_multilib: false
            cache_id: linux-gcc-x64

          - name: Linux GCC x86
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc
            cxx: g++
            arch: x86
            linux_multilib: true
            cache_id: linux-gcc-x86

          - name: Linux GCC ARM64
            os: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc
            cxx: g++
            arch: arm64
            linux_multilib: false
            cache_id: linux-gcc-arm64

          - name: Linux Clang x64
            os: ubuntu-24.04
            compiler: clang
            cc: clang
            cxx: clang++
            arch: x64
            linux_multilib: false
            cache_id: linux-clang-x64

          - name: Linux Clang ARM64
            os: ubuntu-24.04-arm
            compiler: clang
            cc: clang
            cxx: clang++
            arch: arm64
            linux_multilib: false
            cache_id: linux-clang-arm64

          - name: macOS Apple Clang x64
            os: macos-15-intel
            compiler: apple-clang
            cc: clang
            cxx: clang++
            arch: x64
            cache_id: macos-apple-clang-x64

          - name: macOS Apple Clang ARM64
            os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++
            arch: arm64
            cache_id: macos-apple-clang-arm64

          - name: macOS GCC x64
            os: macos-15-intel
            compiler: gcc
            cc: gcc
            cxx: g++
            arch: x64
            build_projectwx: OFF
            build_testing: OFF
            cache_id: macos-gcc-x64

          - name: macOS GCC ARM64
            os: macos-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            arch: arm64
            build_projectwx: OFF
            build_testing: OFF
            cache_id: macos-gcc-arm64

          - name: macOS LLVM x64
            os: macos-15-intel
            compiler: llvm
            cc: clang
            cxx: clang++
            arch: x64
            cache_id: macos-llvm-x64

          - name: macOS LLVM ARM64
            os: macos-latest
            compiler: llvm
            cc: clang
            cxx: clang++
            arch: arm64
            cache_id: macos-llvm-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          path: project

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .ccache
          key: ccache-experimental-v2-${{ matrix.cache_id }}-Release
          restore-keys: |
            ccache-experimental-v2-${{ matrix.cache_id }}-Release-
            ccache-experimental-${{ matrix.cache_id }}-Release-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [[ "${{ matrix.linux_multilib }}" == "true" ]]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y ninja-build ccache pkg-config gcc-multilib g++-multilib libwxgtk3.2-dev:i386 libgtest-dev:i386
            echo "CFLAGS=-m32" >> "$GITHUB_ENV"
            echo "CXXFLAGS=-m32" >> "$GITHUB_ENV"
            echo "LDFLAGS=-m32" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y ninja-build ccache pkg-config libwxgtk3.2-dev libgtest-dev
          fi
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            sudo apt-get install -y clang
          fi

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ninja ccache wxwidgets googletest
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            brew install gcc
            gcc_prefix="$(brew --prefix gcc)"
            gcc_major="$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)"
            echo "CC=${gcc_prefix}/bin/gcc-${gcc_major}" >> "$GITHUB_ENV"
            echo "CXX=${gcc_prefix}/bin/g++-${gcc_major}" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.compiler }}" == "llvm" ]]; then
            brew install llvm
            llvm_prefix="$(brew --prefix llvm)"
            test -x "$llvm_prefix/bin/clang"
            test -x "$llvm_prefix/bin/clang++"
            echo "CC=${llvm_prefix}/bin/clang" >> "$GITHUB_ENV"
            echo "CXX=${llvm_prefix}/bin/clang++" >> "$GITHUB_ENV"
            echo "PATH=${llvm_prefix}/bin:$PATH" >> "$GITHUB_ENV"
          fi

      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja ccache -y --no-progress

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msys2_msystem }}
          update: false
          path-type: minimal
          install: ${{ matrix.msys2_toolchain }}

      - name: Setup MSYS2 CLANGARM64
        id: msys2-arm64
        if: runner.os == 'Windows' && matrix.compiler == 'clangarm64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: CLANGARM64
          update: false
          release: false
          cache: true
          path-type: minimal
          install: ${{ matrix.msys2_toolchain }}
          pacboy: ${{ matrix.msys2_packages }}

      - name: Add MSYS2 compiler to PATH
        if: runner.os == 'Windows' && (matrix.compiler == 'mingw' || matrix.compiler == 'clangarm64')
        shell: pwsh
        run: |
          if ("${{ matrix.compiler }}" -eq "clangarm64") {
            $msysRoot = "${{ steps.msys2-arm64.outputs.msys2-location }}"
          } else {
            $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          }
          if (-not $msysRoot) { throw "MSYS2 location output was empty" }
          $bin = Join-Path $msysRoot "${{ matrix.msys2_bin }}"
          if (-not (Test-Path $bin)) { throw "MSYS2 compiler directory not found: $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if ("${{ matrix.compiler }}" -eq "clangarm64") {
            $prefix = Join-Path $msysRoot "clangarm64"
            "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Locate Visual Studio environment
        if: runner.os == 'Windows' && (matrix.compiler == 'msvc' || matrix.compiler == 'llvm')
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          if ("${{ matrix.arch }}" -eq "arm64") {
            $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
            if (-not $vsRoot) { throw "Native ARM64 MSVC toolset not found" }
            $vsRoot = ($vsRoot | Select-Object -First 1).Trim()
            $vsDevCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
            $wrapper = Join-Path $env:GITHUB_WORKSPACE "vs-arm64-env.bat"
            Set-Content -Path $wrapper -Value "@echo off" -Encoding ascii
            Add-Content -Path $wrapper -Value ('call "' + $vsDevCmd + '" -arch=arm64 -host_arch=arm64') -Encoding ascii
            "ENVIRONMENT_SCRIPT=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsRoot) { throw "Visual Studio C++ toolset not found" }
            $vsRoot = ($vsRoot | Select-Object -First 1).Trim()
            $script = Join-Path $vsRoot "VC\Auxiliary\Build\${{ matrix.environment_script }}"
            if (-not (Test-Path $script)) { throw "Expected environment script not found at $script" }
            "ENVIRONMENT_SCRIPT=$script" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Get custom Windows vcpkg triplets
        if: runner.os == 'Windows' && matrix.compiler != 'clangarm64' && matrix.external_triplets == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Neumann-A/my-vcpkg-triplets
          ref: ${{ env.MY_VCPKG_TRIPLETS_COMMIT }}
          path: my-vcpkg-triplets
          fetch-depth: 1

      - name: Restore Windows vcpkg binary cache
        id: vcpkg-cache-restore
        if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: project/vcpkg_cache
          key: vcpkg-experimental-${{ matrix.cache_id }}-${{ env.VCPKG_GIT_REF }}-${{ env.MY_VCPKG_TRIPLETS_COMMIT }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('project/vcpkg.json') }}
          restore-keys: |
            vcpkg-experimental-${{ matrix.cache_id }}-

      - name: Bootstrap and install vcpkg
        if: runner.os == 'Windows' && matrix.compiler != 'clangarm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path project\vcpkg_cache | Out-Null
          if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
          git init vcpkg
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C vcpkg fetch --depth 1 --no-tags origin $env:VCPKG_GIT_REF
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch vcpkg $env:VCPKG_GIT_REF" }
          git -C vcpkg checkout FETCH_HEAD
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          $env:VCPKG_MANIFEST_MODE = "OFF"
          $env:VCPKG_DEFAULT_HOST_TRIPLET = "${{ matrix.vcpkg_host_triplet }}"
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:GITHUB_WORKSPACE\project\vcpkg_cache,readwrite"
          if ("${{ matrix.external_triplets }}" -eq "true") {
            .\vcpkg\vcpkg.exe install --triplet "${{ matrix.vcpkg_triplet }}" --overlay-triplets="$env:GITHUB_WORKSPACE\my-vcpkg-triplets" wxwidgets gtest
          } else {
            .\vcpkg\vcpkg.exe install --triplet "${{ matrix.vcpkg_triplet }}" wxwidgets gtest
          }
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Save Windows vcpkg binary cache
        if: runner.os == 'Windows' && matrix.compiler != 'clangarm64' && success() && steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: project/vcpkg_cache
          key: vcpkg-experimental-${{ matrix.cache_id }}-${{ env.VCPKG_GIT_REF }}-${{ env.MY_VCPKG_TRIPLETS_COMMIT }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('project/vcpkg.json') }}

      - name: Configure
        working-directory: project
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          RUNNER_OS: ${{ runner.os }}
          ENVIRONMENT_SCRIPT: ${{ env.ENVIRONMENT_SCRIPT }}
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
          VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
          USE_VCPKG: ${{ matrix.use_vcpkg }}
          PACKAGE_TOOLCHAIN: ${{ matrix.compiler }}
          BUILD_TYPE: Release
          BUILD_PROJECTWX: ${{ matrix.build_projectwx }}
          BUILD_TESTING: ${{ matrix.build_testing }}
        run: cmake -P ./.github/scripts/configure.cmake

      - name: Verify configured compiler
        working-directory: project
        shell: bash
        run: |
          cxx_bin="$(sed -n 's/^CMAKE_CXX_COMPILER:FILEPATH=//p' build/CMakeCache.txt | head -1)"
          test -n "$cxx_bin"
          test -x "$cxx_bin"
          echo "Configured CXX: $cxx_bin"
          if [[ "${{ matrix.compiler }}" == "msvc" ]]; then
            CXX_BIN="$cxx_bin" powershell -NoProfile -Command '
              & "$env:CXX_BIN" /?
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            '
          else
            "$cxx_bin" --version
          fi

      - name: Build
        working-directory: project
        env:
          CXX: ${{ matrix.cxx }}
          RUNNER_OS: ${{ runner.os }}
          ENVIRONMENT_SCRIPT: ${{ env.ENVIRONMENT_SCRIPT }}
          BUILD_TYPE: Release
        run: cmake -P ./.github/scripts/build.cmake

      - name: Save compiler cache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true' && hashFiles('.ccache/**') != ''
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .ccache
          key: ccache-experimental-v2-${{ matrix.cache_id }}-Release

      - name: Test
        if: matrix.build_testing != 'OFF'
        working-directory: project
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          RUNNER_OS: ${{ runner.os }}
          BUILD_TYPE: Release
        run: cmake -P ./.github/scripts/test.cmake

      - name: Install
        working-directory: project
        run: cmake --install build --prefix instdir --strip --config Release

      - name: Verify binary architecture
        working-directory: project
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -NoProfile -Command '
              $exe = Get-ChildItem -Recurse -File build\bin -Filter projectcli.exe | Select-Object -First 1
              if (-not $exe) { throw "projectcli.exe not found" }
              $bytes = [IO.File]::ReadAllBytes($exe.FullName)
              if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
                throw "Not a valid PE executable: $($exe.FullName)"
              }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
                throw "Invalid PE header offset: $peOffset"
              }
              if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
                  $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
                throw "Invalid PE signature"
              }
              $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
              $expected = switch ("${{ matrix.arch }}") {
                "arm64" { [UInt16]0xAA64 }
                "x86"   { [UInt16]0x014C }
                default { [UInt16]0x8664 }
              }
              if ($machine -ne $expected) {
                throw ("Expected {0} PE (0x{1:X4}), got 0x{2:X4}" -f "${{ matrix.arch }}", $expected, $machine)
              }
              "Verified $($exe.FullName): PE machine 0x{0:X4}" -f $machine
            '
          else
            target="$(find build/bin -maxdepth 1 -type f -perm -111 -print -quit)"
            test -n "$target"
            file "$target"
            case "${{ matrix.arch }}" in
              x86) file "$target" | grep -Eq '32-bit|Intel 80386' ;;
              arm64) file "$target" | grep -Eiq 'arm aarch64|arm64' ;;
              x64) file "$target" | grep -Eq 'x86-64|x86_64|Mach-O 64-bit executable x86_64' ;;
              *) exit 1 ;;
            esac
          fi


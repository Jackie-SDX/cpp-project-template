name: Patch vcpkg cache policy

on:
  push:
    branches:
      - reconcile/gitlab-github-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Enable cache persistence for PR runs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          s = p.read_text(encoding='utf-8')
          old = "if: runner.os == 'Windows' && github.event_name != 'pull_request'\n        uses: actions/cache/save@v5"
          new = "if: runner.os == 'Windows' && success() && steps.vcpkg-binary-cache-restore.outputs.cache-hit != 'true'\n        uses: actions/cache/save@v5"
          if old not in s:
              raise SystemExit('target cache condition not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/_patch-vcpkg-cache.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release.yml .github/workflows/_patch-vcpkg-cache.yml
          git commit -m "ci: persist Windows vcpkg cache from PR builds"
          git push

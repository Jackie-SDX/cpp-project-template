name: GH Doxygen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOXYGEN_VERSION: "1.15.0"
  CMAKE_VERSION: "4.0.3"
  GRAPHVIZ_VERSION: "13.1.1"

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: "true"
      - name: Cache CMake
        id: cache-cmake
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: cmake-install
          key: cmake-cache-${{ env.CMAKE_VERSION }}
      - name: Install CMake
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p cmake-install
          curl -fL -o cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xf cmake.tar.gz --strip-components=1 -C cmake-install
      - name: Add CMake to PATH
        run: echo "${GITHUB_WORKSPACE}/cmake-install/bin" >> "$GITHUB_PATH"
      - name: Cache Doxygen
        id: cache-doxygen
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: doxygen-${{ env.DOXYGEN_VERSION }}
          key: doxygen-cache-${{ env.DOXYGEN_VERSION }}
      - name: Install Doxygen
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          version_underscore=$(echo "$DOXYGEN_VERSION" | sed 's/\./_/g')
          dirname=doxygen-$DOXYGEN_VERSION
          filename_tar=$dirname.linux.bin.tar
          filename_gz=$filename_tar.gz
          url=https://github.com/doxygen/doxygen/releases/download/Release_$version_underscore/$filename_gz
          curl -fL -o "$filename_gz" "$url"
          gunzip "$filename_gz"
          tar xf "$filename_tar"
      - name: Add Doxygen to PATH
        run: echo "${GITHUB_WORKSPACE}/doxygen-${{ env.DOXYGEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Cache & install build deps + fonts
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >
            build-essential pkg-config libexpat1-dev libltdl-dev
            libcairo2-dev libpango1.0-dev libfontconfig1-dev
            libfreetype6-dev libpng-dev libjpeg-dev zlib1g-dev
            fontconfig fonts-dejavu-core fonts-liberation gsfonts fonts-urw-base35
          version: 3
      - name: Cache Graphviz build
        id: cache-graphviz-cairo
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: graphviz-install
          key: ${{ runner.os }}-graphviz-${{ env.GRAPHVIZ_VERSION }}-cairo-nogd
      - name: Build & install Graphviz
        if: steps.cache-graphviz-cairo.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL -o "graphviz-${GRAPHVIZ_VERSION}.tar.gz" "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/${GRAPHVIZ_VERSION}/graphviz-${GRAPHVIZ_VERSION}.tar.gz"
          tar -xf "graphviz-${GRAPHVIZ_VERSION}.tar.gz"
          cd "graphviz-${GRAPHVIZ_VERSION}"
          ./configure --prefix="${GITHUB_WORKSPACE}/graphviz-install" --without-gd --disable-swig --disable-guile --disable-java --disable-lua --disable-perl --disable-php --disable-python --disable-r --disable-ruby
          make -j"$(nproc)"
          make install
      - name: Add Graphviz to PATH & set lib path
        run: |
          echo "${GITHUB_WORKSPACE}/graphviz-install/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/graphviz-install/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Refresh font caches & Graphviz plugin cache
        run: |
          set -euo pipefail
          unset FONTCONFIG_FILE FONTCONFIG_PATH || true
          fc-cache -f
          "${GITHUB_WORKSPACE}/graphviz-install/bin/dot" -c || true
          "${GITHUB_WORKSPACE}/graphviz-install/bin/dot" -V
      - name: Generate Doxygen Documentation
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          cmake .. -DBUILD_SOURCE=OFF -DDOXYGEN_GENERATE_LATEX=FALSE -DDOXYGEN_DOT_FONTNAME="Helvetica"
          cmake --build . --target doxygen
          test -f ../docs/doxygen/build/html/index.html
      - name: Upload documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/doxygen/build/html
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true

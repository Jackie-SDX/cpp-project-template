# =============================================================================
# Release vcpkg cache warmup
# =============================================================================
# Purpose
# --------
# Pre-builds the Windows vcpkg dependency caches used by release.yml so tag-push
# release runs can restore pre-built wxWidgets/GoogleTest binaries instead of
# compiling them from scratch on public runners. Runs on a schedule (weekly) and
# whenever dependency or workflow files change.
#
# This workflow is the *designated seeder* of the release vcpkg cache family
# (see docs/architecture/decisions/006-vcpkg-binary-cache-key-contract.md):
#   * every key comes from scripts/vcpkg_cache_key.sh (one canonical layout),
#   * it always runs `vcpkg install` so a restored seed is *verified*, not just
#     restored (an exact hit that still compiles packages is reported as a
#     stale-seed warning),
#   * it records "seeded_at" for each key in a tiny cache entry so release.yml
#     can distinguish "cold start" (never seeded: proceed and build) from
#     "seed we know should exist is missing" (fail the release gate).
#
# Trigger rules
# -------------
#   * push to main when vcpkg.json / the release-related workflows / the GitLab
#     triplet overlay change, a weekly cron, and manual dispatch.
#
# References
# ----------
#   * Scheduled workflows: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
#   * vcpkg:              https://vcpkg.io
#   * actions/cache:      https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
# =============================================================================

name: Release vcpkg cache warmup

on:
  push:
    branches: [ main ]
    paths:
      - 'vcpkg.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/vcpkg-cache-warmup.yml'
      - '.gitlab/vcpkg-triplets/**'
  schedule:
    - cron: '15 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_GIT_REF: e0a6b8572cf0ac716fdc11466522cf744e97e0bd
  VCPKG_CACHE_NAMESPACE: master
  MY_VCPKG_TRIPLETS_COMMIT: e5f3f2d06430fa475feccbb34a5d61023807b854

jobs:
  warmup:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC x64
            os: windows-latest
            cc: cl
            cxx: cl
            environment_script: vcvars64.bat
            vcpkg_triplet: x64-windows-static
            toolchain: msvc
            arch: x64
            external_triplets: true
          - name: Windows MSVC x86
            os: windows-latest
            cc: cl
            cxx: cl
            environment_script: vcvars32.bat
            vcpkg_triplet: x86-windows-static
            toolchain: msvc
            arch: x86
            external_triplets: true
          - name: Windows MinGW x64
            os: windows-latest
            cc: gcc
            cxx: g++
            vcpkg_triplet: x64-mingw-dynamic
            toolchain: mingw
            arch: x64
            external_triplets: true
            msys2_msystem: MINGW64
            msys2_toolchain: mingw-w64-x86_64-toolchain
            msys2_bin: mingw64/bin
          - name: Windows MinGW x86
            os: windows-latest
            cc: gcc
            cxx: g++
            vcpkg_triplet: x86-mingw-dynamic
            toolchain: mingw
            arch: x86
            external_triplets: true
            msys2_msystem: MINGW32
            msys2_toolchain: mingw-w64-i686-toolchain
            msys2_bin: mingw32/bin
          - name: Windows LLVM x64
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            environment_script: vcvars64.bat
            vcpkg_triplet: x64-win-llvm-release
            toolchain: llvm
            arch: x64
            external_triplets: true
          - name: Windows LLVM x86
            os: windows-latest
            cc: clang-cl
            cxx: clang-cl
            environment_script: vcvars32.bat
            vcpkg_triplet: x86-win-llvm
            toolchain: llvm
            arch: x86
            external_triplets: true
          - name: Windows MSVC ARM64
            os: windows-11-arm
            cc: cl
            cxx: cl
            environment_script: vcvars-arm64.bat
            vcpkg_triplet: arm64-windows
            toolchain: msvc
            arch: arm64
            external_triplets: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: project

      - name: Locate MSVC environment script
        if: matrix.toolchain == 'msvc' || matrix.toolchain == 'llvm'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" }
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          if ("${{ matrix.arch }}" -eq "arm64") {
            $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
            if (-not $vsRoot) { throw "Native ARM64 MSVC toolset not found" }
            $vsRoot = ($vsRoot | Select-Object -First 1).Trim()
            $script = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
            $wrapper = Join-Path $env:GITHUB_WORKSPACE "vs-arm64-env.bat"
            Set-Content -Path $wrapper -Value "@echo off" -Encoding ascii
            Add-Content -Path $wrapper -Value ('call "' + $script + '" -arch=arm64 -host_arch=arm64') -Encoding ascii
            "ENVIRONMENT_SCRIPT=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsRoot) { throw "No Visual Studio installation with the C++ toolset was found." }
            $script = Join-Path $vsRoot "VC\Auxiliary\Build\${{ matrix.environment_script }}"
            if (-not (Test-Path $script)) { throw "Expected vcvars script not found at $script" }
            "ENVIRONMENT_SCRIPT=$script" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Install cache tooling
        shell: bash
        run: choco install 7zip -y --no-progress

      - name: Refresh Windows environment
        shell: pwsh
        run: |
          if (Test-Path "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1") {
            Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
            refreshenv
          }
          7z | Select-Object -First 1

      # CORE-1/P0-4: the MinGW legs must compile with the matching MSYS2
      # toolchain (x64->MINGW64, x86->MINGW32), exactly like release.yml does.
      # Without this the warmup seeder cannot rebuild a MinGW seed from cold,
      # so a cold cache would stay cold instead of being re-seeded.
      - name: Setup MSYS2 MinGW
        id: msys2
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: ${{ matrix.msys2_msystem }}
          update: false
          path-type: minimal
          install: ${{ matrix.msys2_toolchain }}
      - name: Add MSYS2 compiler to PATH
        if: matrix.toolchain == 'mingw'
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msysRoot) { throw "MSYS2 location output was empty" }
          $bin = Join-Path $msysRoot "${{ matrix.msys2_bin }}"
          if (-not (Test-Path $bin)) { throw "MSYS2 compiler directory not found: $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Assert MinGW target architecture
        if: matrix.toolchain == 'mingw'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64) want=x86_64-w64-mingw32 ;;
            x86) want=i686-w64-mingw32 ;;
            *) echo "unknown mingw arch ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          got=$(gcc -dumpmachine | tr '[:upper:]' '[:lower:]')
          echo "gcc -dumpmachine = $got (expected $want)"
          test "$got" = "$want"

      - name: Get Windows vcpkg triplets
        if: matrix.external_triplets != false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Neumann-A/my-vcpkg-triplets
          ref: ${{ env.MY_VCPKG_TRIPLETS_COMMIT }}
          path: my-vcpkg-triplets
          fetch-depth: 1

      # ADR 006: one canonical key layout for the whole release cache family.
      # The script emits VCPKG_CACHE_PREFIX, VCPKG_CACHE_KEY and
      # VCPKG_CACHE_RESTORE_KEYS (which includes the pre-ADR-006 prefixes so
      # existing warm caches keep serving as a best-effort restore).
      - name: Resolve release vcpkg cache key
        shell: bash
        run: |
          bash project/scripts/vcpkg_cache_key.sh github-env \
            --family release \
            --toolchain "${{ matrix.toolchain }}" \
            --arch "${{ matrix.arch }}" \
            --build-type Release \
            --manifest project/vcpkg.json

      - name: Checkout Windows vcpkg
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_GIT_REF }}
          path: vcpkg
          fetch-depth: 1
      - name: Restore Windows vcpkg tool cache
        if: runner.os == 'Windows'
        id: vcpkg-tool-cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: vcpkg/vcpkg.exe
          key: vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
          restore-keys: |
            vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-
      - name: Bootstrap Windows vcpkg
        if: runner.os == 'Windows' && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: vcpkg
        run: .\bootstrap-vcpkg.bat -disableMetrics
      - name: Verify Windows vcpkg tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path .\vcpkg\vcpkg.exe)) { throw 'vcpkg.exe was not restored or bootstrapped' }
          & .\vcpkg\vcpkg.exe version
      - name: Save Windows vcpkg tool cache
        if: runner.os == 'Windows' && success() && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: vcpkg/vcpkg.exe
          key: vcpkg-tool-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}
      - name: Restore release vcpkg binary cache
        id: vcpkg-binary-cache-restore
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: project/vcpkg_cache
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_RESTORE_KEYS }}
      - name: Record restored cache entry count
        id: cache-state
        shell: bash
        run: |
          # A cold start has no project/vcpkg_cache directory at all (actions/cache
          # only materializes the path when something was restored). find(1) then
          # exits 1, and under `bash -e -o pipefail` that killed the step before
          # the save steps could ever run -- which is why a never-seeded key
          # never produced a cache. Treat "directory absent" as zero entries.
          before=0
          if [ -d project/vcpkg_cache ]; then
            before="$(find project/vcpkg_cache -type f -name '*.zip' | wc -l | tr -d ' ')"
          fi
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "restored zip entries: ${before} (exact hit: ${{ steps.vcpkg-binary-cache-restore.outputs.cache-hit }})"

      - name: Restore vcpkg download cache
        id: vcpkg-download-cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: vcpkg_downloads
          key: vcpkg-downloads-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}
          restore-keys: |
            vcpkg-downloads-windows-${{ runner.arch }}-
      # Always runs, including on an exact cache hit: as the seeder of the
      # release cache family, warmup must *verify* that a restored seed really
      # serves every package instead of silently rebuilding it.
      - name: vcpkg
        shell: pwsh
        env:
          VCPKG_MANIFEST_MODE: OFF
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\project\vcpkg_cache,readwrite
          VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg_downloads
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.arch == 'arm64' && 'arm64-windows' || 'x64-windows' }}
        run: |
          $installArgs = @('--triplet', '${{ matrix.vcpkg_triplet }}', 'wxwidgets', 'gtest')
          if ("${{ matrix.external_triplets }}" -eq "true") {
            $installArgs = @('--triplet', '${{ matrix.vcpkg_triplet }}', '--overlay-triplets=${{ github.workspace }}\my-vcpkg-triplets', 'wxwidgets', 'gtest')
          }
          $lastExitCode = 1
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            & .\vcpkg\vcpkg.exe install @installArgs
            $lastExitCode = $LASTEXITCODE
            if ($lastExitCode -eq 0) { break }
            if ($attempt -lt 5) {
              Write-Host "vcpkg install failed with exit code $lastExitCode; retrying attempt $($attempt + 1)/5..."
              Start-Sleep -Seconds ([int][Math]::Pow(2, $attempt))
            }
          }
          if ($lastExitCode -ne 0) { throw "vcpkg install failed after 5 attempts with exit code $lastExitCode" }
      # An exact hit that still compiled packages means the seed under that key
      # is ABI-incompatible with the current inputs. Report it: the save step is
      # (correctly) skipped on an exact hit, so nothing here can self-heal.
      - name: Detect stale vcpkg binary cache seed
        if: steps.vcpkg-binary-cache-restore.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ steps.cache-state.outputs.before }}"
          after=0
          if [ -d project/vcpkg_cache ]; then
            after="$(find project/vcpkg_cache -type f -name '*.zip' | wc -l | tr -d ' ')"
          fi
          echo "zip entries before install: ${before}, after: ${after}"
          if [ "${after}" -gt "${before}" ]; then
            echo "::warning::Stale vcpkg seed under key ${VCPKG_CACHE_KEY}: the exact cache hit did not contain $((after - before)) package(s) that had to be rebuilt. Delete that cache key and re-run 'Release vcpkg cache warmup' to replace it."
          fi
      - name: Save vcpkg download cache
        if: always() && steps.vcpkg-download-cache.outputs.cache-hit != 'true' && hashFiles('vcpkg_downloads/**') != ''
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: vcpkg_downloads
          key: vcpkg-downloads-windows-${{ runner.arch }}-${{ env.VCPKG_GIT_REF }}
      - name: Save release vcpkg binary cache
        id: vcpkg-binary-cache-save
        if: success() && steps.vcpkg-binary-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: project/vcpkg_cache
          key: ${{ env.VCPKG_CACHE_KEY }}
      # ADR 006: publish "this key was seeded by a successful warmup run" so
      # release.yml can tell a legitimate cold start (no record: build) from a
      # seed that should exist but disappeared (fresh record: fail the gate).
      - name: Write vcpkg cache seed record
        if: success() && steps.vcpkg-binary-cache-save.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vcpkg-seed
          {
            echo "key=${VCPKG_CACHE_KEY}"
            echo "seeded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "seeded_at_epoch=$(date -u +%s)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workflow=vcpkg-cache-warmup"
          } > .vcpkg-seed/record
          echo "seed record for ${VCPKG_CACHE_KEY}:"
          cat .vcpkg-seed/record
      - name: Save vcpkg cache seed record
        if: success() && steps.vcpkg-binary-cache-save.outcome != 'failure'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8
        with:
          path: .vcpkg-seed/record
          key: vcpkg-seed-${{ env.VCPKG_CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
  msys2-clangarm64:
    name: Windows CLANGARM64 MSYS2 cache
    runs-on: windows-11-arm
    steps:
      - name: Setup MSYS2 CLANGARM64
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: false
          release: false
          cache: true
          path-type: minimal
          install: mingw-w64-clang-aarch64-toolchain
          pacboy: wxwidgets3.2-msw:p gtest:p
      - name: Verify CLANGARM64 toolchain
        shell: pwsh
        run: |
          $root = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $root) { throw "MSYS2 location output is empty" }
          $clang = Join-Path $root "clangarm64\bin\clang.exe"
          $clangxx = Join-Path $root "clangarm64\bin\clang++.exe"
          if (-not (Test-Path $clang)) { throw "CLANGARM64 clang.exe not found" }
          if (-not (Test-Path $clangxx)) { throw "CLANGARM64 clang++.exe not found" }
          & $clang --version
          & $clangxx --version

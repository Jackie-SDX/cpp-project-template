# =============================================================================
# Workflow Lint
# =============================================================================
# Purpose
# --------
# Runs actionlint against every workflow in .github/workflows on push/PR, i.e.
# the repo's own gate that statically validates the whole pipeline (structure,
# expressions, action references). A red run here means a workflow is invalid.
#
# The second step closes the gap actionlint leaves: it resolves every pinned
# `uses: owner/repo@<sha>` against the upstream repository, because GitHub
# accepts an invented SHA at parse time and only fails when a workflow
# referencing it is actually run (see .github/scripts/verify_action_pins.sh).
# Floating tag/branch refs are reported as informational, not fatal.
#
# Trigger rules
# -------------
#   * push to main or the experimental branch, pull requests to main, manual.
#
# References
# ----------
#   * actionlint:          https://github.com/rhysd/actionlint
#   * Workflow reference:  https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#   * Pinning actions:     https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
# =============================================================================

name: Workflow Lint

on:
  push:
    branches:
      - main
      - experimental/all-platforms-architectures-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 \
            -color -shellcheck= -pyflakes=

      - name: Verify pinned action SHAs exist upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/verify_action_pins.sh --dir .github/workflows
